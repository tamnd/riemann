name: deploy

# Build riemann.tamnd.com with rh from riemann-agent, check it, and deploy it to the Cloudflare Worker riemann. A pull request builds and checks the site but does not deploy it. The daily run gets the new nodes of Math 2.0.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    name: build, check and deploy the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: content
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/riemann-agent
          ref: main
          path: toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolchain/go.mod
          cache-dependency-path: toolchain/go.sum
      - name: build rh
        working-directory: toolchain
        run: go build -trimpath -o "$RUNNER_TEMP/rh" ./cmd/rh
      - name: build the site
        env:
          COMMIT: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/rh" site build -content content -out content/public -url https://riemann.tamnd.com -commit "$COMMIT" -date now -strict
      - name: check the site
        run: |
          "$RUNNER_TEMP/rh" site check -dir content/public
      - name: deploy
        if: github.event_name != 'pull_request'
        working-directory: content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the site is not deployed"
            exit 0
          fi
          npx --yes wrangler@4 deploy --message "riemann $COMMIT"
