- name: 'Formalism.ConjugateSelfDual.G'
  kind: abbrev
  says: 'The Galois group of $\Omega$ over $F$, written as the $F$-algebra automorphisms of $\Omega$.'
- name: 'Formalism.ConjugateSelfDual.IsPlaceOver'
  kind: def
  says: 'The statement that the valuation subring $A$ of $\Omega$ lies over the finite place $v$ of $F$. It says that an integer $x$ of $F$ has valuation less than 1 for $A$ exactly when $x$ is in the prime ideal of $v$.'
- name: 'Formalism.ConjugateSelfDual.Qbar'
  kind: abbrev
  says: 'An algebraic closure of $\mathbb Q_l$.'
  math: '$\overline{\mathbb Q}_l$'
