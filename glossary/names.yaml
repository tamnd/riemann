- name: 'UpperTheory.Zero'
  kind: namespace
  says: 'Declarations that lead to local Langlands. The short name does not say its role.'
  status: open
- name: 'UpperTheory.Zero.LLC'
  kind: namespace
  says: 'Declarations on local Langlands for $GL_n$, for example IsRecT, LawsT and recTExists.'
  math2: '9E45NBX1G0'
- name: 'UpperTheory.Zero.LLC.IsRecT'
  kind: def
  says: 'The statement that rc is a local reciprocity map of the kind the proof needs. It says that there is a local Artin map $a$ such that rc obeys the laws LawsT for $a$.'
  math2: '9E45NBX1G0'
  step: 'is-rect-def'
- name: 'UpperTheory.Zero.LLC.LawsT'
  kind: structure
  says: 'Twelve laws for a map rc from irreducible representations of $GL_n$ to Weil-Deligne classes. They include dimension, the Langlands sum over segments, twists, central character, duals, injectivity, depth and type, and some apply only to Good classes. The laws do not fix the local Langlands map uniquely and do not mention L-factors or $\varepsilon$-factors.'
  math2: '9E45NBX1G0'
- name: 'UpperTheory.Zero.LLC.Pr'
  kind: namespace
  says: 'Eight theorems that prove published statements on representations of $GL_n$ over local fields, for example exh and multi.'
- name: 'UpperTheory.Zero.LLC.Pr.exh'
  kind: theorem
  says: 'Proves LanglandsExhaustionGL: each irreducible representation of $GL_n$ comes from a multisegment. It uses PositivityTheory.Exh.langlandsExhaustionGL_holds.'
  math2: '9E45NBX1G0'
- name: 'UpperTheory.Zero.LLC.Pr.multi'
  kind: theorem
  says: 'Proves LanglandsMultisegments: the multisegment of a representation is unique, with a statement about subquotients.'
- name: 'UpperTheory.Zero.LLC.RecTExists'
  kind: def
  says: 'The statement that each finite place of each number field has a map rc with IsRecT. It is an existence statement of local Langlands type.'
  math2: '9E45NBX1G0'
  step: 'rect-exists-def'
- name: 'UpperTheory.Zero.LLC.TypeAt'
  kind: def
  says: 'The type law at one representation $x$. If $E_w\cong\mathbb Q_g$ and $x$ is inflated from a cuspidal representation of $GL_n(\mathbb F_g)$ named by a regular character $\theta$, then the Weil-Deligne class has the expected monodromy and inertia.'
- name: 'UpperTheory.Zero.LLC.artEx'
  kind: theorem
  says: 'Shows that there is exactly one local Artin map for a place. This is local class field theory in the form the proof needs.'
- name: 'UpperTheory.Zero.LLC.cuspEx'
  kind: theorem
  says: 'Gives a map on cuspidal classes that obeys the cuspidal laws CuspT. On cuspidal classes that are not GoodCusp the map uses placeholder values, so the laws there say little.'
  math2: '9AZ164C298'
- name: 'UpperTheory.Zero.LLC.extDepth'
  kind: theorem
  says: 'For an extension rc, proves that a Good class of depth zero goes to a tame Weil-Deligne class.'
- name: 'UpperTheory.Zero.LLC.extDim'
  kind: theorem
  says: 'For an extension rc of a cuspidal map, proves the dimension law, the characteristic polynomial from the support, and the absolute determinant law. On Good classes it also proves the determinant equals the central character.'
- name: 'UpperTheory.Zero.LLC.extDual'
  kind: theorem
  says: 'For an extension rc, proves the dual law on Good classes.'
- name: 'UpperTheory.Zero.LLC.extInj'
  kind: theorem
  says: 'For an extension rc, proves injectivity on Good classes.'
- name: 'UpperTheory.Zero.LLC.extTw'
  kind: theorem
  says: 'For an extension rc, proves that rc commutes with twists by $|\det|^s$. On Good classes it also proves that rc commutes with twists by characters.'
- name: 'UpperTheory.Zero.LLC.recTExists'
  kind: theorem
  says: 'Proves RecTExists. It builds rc from the local Artin map, a map on cuspidal classes, and its extension through Langlands multisegments, and then checks each law. On cuspidal classes that are not GoodCusp, the map takes placeholder values.'
  math2: '9E45NBX1G0'
  step: 'rect-exists'
- name: 'UpperTheory.Zero.LLC.typeIff'
  kind: theorem
  says: 'Shows that the type law for rc is equivalent to TypeAt at every representation $x$.'
- name: 'allChi'
  kind: theorem
  says: 'States UpperTheory.EveryCharacter. It is a short name for UpperTheory.FinalTheorems.everyCharacter.'
  math2: 'DNKA4WBKDS'
  step: 'all-chi'
- name: 'rhOfAll'
  kind: theorem
  says: 'Gets the Riemann hypothesis from the statement for every Dirichlet character. It applies Formalism.VW.rh_of_every to allChi.'
  math2: 'VCGF9YR36X'
  step: 'rh-of-all'
- name: 'riemannHypothesis'
  kind: theorem
  says: 'The final theorem of the proof. It states Mathlib''s RiemannHypothesis and is proved as rhOfAll.'
  math: '$\zeta(s)=0,\ s\notin\{-2,-4,-6,\dots\},\ s\ne1 \Rightarrow \operatorname{Re}s=\tfrac12$'
  math2: 'VCGF9YR36X'
  step: 'riemann-hypothesis'
