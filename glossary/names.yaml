- name: 'Formalism.MainNotions'
  kind: namespace
  says: 'Main notions on families and bounds, for example Closed and LinkN.'
- name: 'Formalism.MainNotions.Closed'
  kind: def
  says: 'The statement that $P$ holds for all small $\varepsilon$, for each family in the class whose constants are large enough. This is the "closed" of "closed bound".'
  math: '$\exists\varepsilon_1>0\ \forall\varepsilon\in(0,\varepsilon_1]\ \exists K\ \forall F\in\mathcal C,\ F \text{ large for } K \Rightarrow P(F)$'
- name: 'Formalism.MainNotions.LinkN'
  kind: def
  says: 'A bound on the sums etaSum for a family. There are $C$ and $x_0$ such that, for each $x\ge x_0$ and each index with ShaFinOdd, each lift $j$ obeys LinkN_at with the constant $C$.'
- name: 'Formalism.VW'
  kind: namespace
  says: 'Four declarations on the step from zeta to the Riemann hypothesis: critLine, rh_of_every, rh_of_right and gammaFactor_ne_zero. The short name does not say its role.'
  status: open
- name: 'Formalism.VW.rh_of_every'
  kind: theorem
  says: 'Shows that UpperTheory.EveryCharacter implies the Riemann hypothesis. It uses the trivial character of modulus 1, whose L-function is $\zeta$, and then applies rh_of_right.'
  math2: 'VCGF9YR36X'
  step: 'rh-of-every'
- name: 'Formalism.VW.rh_of_right'
  kind: theorem
  says: 'If $\zeta(s)\ne0$ for all $s\ne1$ with $\operatorname{Re}s>\tfrac12$, then the Riemann hypothesis holds. The proof uses the functional equation to move zeros from the left half of the strip to the right half.'
  math2: 'NFXKNDJX9C'
  step: 'rh-of-right'
