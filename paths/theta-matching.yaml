id: theta-matching
title: Theta integrals and local matching
for: [theta-matching]
needs: [algebra, analysis, number-fields, class-field-theory, l-functions, groups, representations, theta]
lead: 'To read this chapter you need Hermitian forms, Hecke characters, the Weil representation and theta lifts for unitary dual pairs, and a little about Dirichlet L-functions.'
items:
  - concept: Hermitian form
    math2: 8NJ7XY6F1S
    says: 'A Hermitian form is a sesquilinear form $h$ with $h(y, x) = \sigma(h(x, y))$.'
    why: 'A triple of [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) has two Hermitian spaces $V$ and $V''$ of given signatures.'
    steps: [theta-integrals-agree-def]
  - concept: Skew-Hermitian form
    text: 'Scharlau, Quadratic and Hermitian Forms, 7.1'
    says: 'A skew-Hermitian form is a sesquilinear form $h$ with $h(y, x) = -\sigma(h(x, y))$.'
    why: 'The third space $W$ of a triple is skew-Hermitian of size $a + a''$, and both theta lifts land in $\mathrm{U}(W)$.'
    steps: [theta-integrals-agree-def]
  - concept: Coinvariants
    text: 'Lang, Algebra, XVI'
    says: 'The coinvariants of a representation $V$ of $G$ are $V_G = V / \operatorname{span}\{gv - v\}$; the invariant linear forms on $V$ are the linear forms on $V_G$.'
    why: 'The condition `Coinv` of [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) says that the kernels of the local maps are the coinvariant spaces `augAt`.'
    steps: [theta-integrals-agree-def]
  - concept: Finite field
    math2: 0ZXZ82FTX2
    says: 'For each prime power $q$ there is a field $\mathbb{F}_q$ with $q$ elements, unique up to isomorphism, and $\mathbb{F}_q^\times$ is cyclic.'
    why: 'The input [GreenRegularCharacters](/step/green-of-regular/) is about characters of $\mathbb{F}_{g^d}^\times$ and cuspidal characters of $\mathrm{GL}_d(\mathbb{F}_g)$.'
    steps: [green-of-regular, green-def]
  - concept: Haar measure
    math2: CE0V9686M8
    says: 'A Haar measure on a locally compact group is a nonzero regular left invariant Borel measure; it exists and is unique up to a positive factor.'
    why: 'The predicate `IsGood` of a model asks that the measure $\mu$ on $\mathrm{U}(X)(\mathbb{A})$ is a Haar measure.'
    steps: [local-matching-def]
  - concept: Fundamental domain
    math2: WEGEXJBX26
    says: 'A fundamental domain for a discrete subgroup $\Gamma$ of $G$ is a measurable set that meets each coset $\Gamma g$ in one point.'
    why: 'The theta integral $I_M(\Phi)$ integrates over `dom`, a fundamental domain for $\mathrm{U}(X)(F)$ in $\mathrm{U}(X)(\mathbb{A})$.'
    steps: [local-matching-def]
  - concept: Schwartz space
    math2: GE020MY43M
    says: 'The Schwartz space is the space of smooth $f$ on $\mathbb{R}^n$ with $\sup |x^\alpha \partial^\beta f| < \infty$ for all $\alpha, \beta$.'
    why: 'The condition `Decay` of [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) asks that $g \mapsto \theta(g, h; \Phi)$ is integrable for each adelic Schwartz function $\Phi$.'
    steps: [theta-integrals-agree-def]
  - concept: Adele ring
    math2: NYJFYZ0B4M
    says: 'The adele ring $\mathbb{A}_K$ is the set of $(x_v) \in \prod_v K_v$ with $x_v \in \mathcal{O}_v$ for almost all finite $v$, with the restricted product topology. The finite adeles $\mathbb{A}_{K,f}$ omit the infinite places.'
    why: 'The groups of a triple are adelic unitary groups $\mathrm{U}_J(\mathbb{A})$ with entries in $\mathbb{A}_F \otimes_F E$.'
    steps: [local-matching-def]
  - concept: Hecke character
    math2: KPYFGB342X
    says: 'A Hecke character of a number field $K$ is a continuous homomorphism $\chi : \mathbb{A}_K^\times \to \mathbb{C}^\times$ with $\chi(K^\times) = 1$, that is a character of the idele class group $C_K$.'
    why: 'The characters $\alpha$ and $\beta$ of a triple are Hecke characters of $\mathbb{A}_E^\times$, and $\nu = \alpha/\beta$ is ramified at each place of $T$.'
    steps: [local-matching-def]
  - concept: Partial L-function
    text: 'Neukirch, Algebraic Number Theory, VII.8'
    says: 'For a finite set $S$ of places, $L^S(s, \chi)$ is the Euler product of $L(s, \chi)$ without the factors at $S$.'
    why: 'The recursion laws `StepAlpha` and `StepBeta` of [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) multiply the constant by a partial L-value $L^{S_0}(s, \nu)$.'
    steps: [theta-integrals-agree-def]
  - concept: Imprimitive characters
    text: 'Davenport, Multiplicative Number Theory, ch. 5'
    says: 'If $\chi$ modulo $N$ is induced from the primitive $\chi^*$, then $L(s, \chi) = L(s, \chi^*) \prod_{p \mid N} (1 - \chi^*(p) p^{-s})$, and the extra factors vanish only on $\operatorname{Re}(s) = 0$.'
    why: 'The step [imprimitive](/step/imprimitive/) passes from `ZeroFreeAll` to all characters with the extra Euler factors of an imprimitive character.'
    steps: [imprimitive]
  - concept: von Mangoldt function
    math2: 0NK8JTE1NN
    says: '$\Lambda(n) = \log p$ if $n = p^k$ with $k \ge 1$, and $0$ otherwise; $-\zeta''/\zeta(s) = \sum_n \Lambda(n) n^{-s}$ for $\operatorname{Re}(s) > 1$.'
    why: 'The function $G_m$ of [the branch](/step/zero-free-all-of-green-v-win/) is built from sums of $\Lambda(n)\psi''(n)(y/n - 1)$.'
    steps: [zero-free-all-of-green-v-win]
  - concept: Reductive dual pair
    text: 'Kudla, Notes on the local theta correspondence (1996), I.1'
    says: 'A reductive dual pair in $\mathrm{Sp}(W)$ is a pair of reductive subgroups, each the centralizer of the other, for example $(\mathrm{U}(V), \mathrm{U}(V''))$ on $W = V \otimes_E V''$.'
    why: 'A triple gives the dual pairs $(\mathrm{U}(V), \mathrm{U}(W))$ and $(\mathrm{U}(V''), \mathrm{U}(W))$ of [ThetaIntegralsAgree](/step/theta-integrals-agree-def/).'
    steps: [theta-integrals-agree-def]
  - concept: Weil representation
    math2: H3Q2703KKV
    says: 'The Weil representation $\omega_\psi$ is the genuine representation of $\mathrm{Mp}(W)$ that intertwines the Stone-von Neumann representation $\rho_\psi$ with its twists by $\mathrm{Sp}(W)$.'
    why: 'The fields `weil` and `weil''` of a triple ask that `om` and `om''` are Weil representations of the two dual pairs.'
    steps: [theta-integrals-agree-def, local-matching-def]
  - concept: Splitting characters of the Weil representation
    text: 'Harris, Kudla and Sweet, Theta dichotomy for unitary groups, J. Amer. Math. Soc. 9 (1996), Section 1'
    says: 'A character $\chi$ of $\mathbb{A}_E^\times / E^\times$ with $\chi|_{\mathbb{A}_F^\times} = \eta^{\dim V}$ splits the metaplectic cover over $\mathrm{U}(V'')$, and a pair of such characters splits it over $\mathrm{U}(V) \times \mathrm{U}(V'')$.'
    why: 'The two Weil representations of a triple have the splitting characters $(\beta, \beta/\alpha)$ and $(\alpha, \alpha/\beta)$.'
    steps: [theta-integrals-agree-def]
  - concept: Vacuum vector
    text: 'Kudla, Notes on the local theta correspondence (1996), II.5'
    says: 'The vacuum vector is the characteristic function of $L^n$ for a self-dual lattice $L$ at a $p$-adic place, and the Gaussian $e^{-\pi\operatorname{tr}(x, x)}$ at a real place.'
    why: '[LocalMatching](/step/local-matching-def/) asks that the two vacuum vectors have the same nonzero image outside the finite set $T$.'
    steps: [local-matching-def]
  - concept: Theta kernel
    text: 'Gelbart, Piatetski-Shapiro and Rallis, Explicit Constructions of Automorphic L-functions, LNM 1254 (1987), Part A, 1'
    says: 'The theta kernel is $\theta(g, h; \varphi) = \sum_{\xi \in V(F)^n} (\omega(g, h)\varphi)(\xi)$, a function of moderate growth on $[G] \times [G'']$.'
    why: 'The function $\theta(g, h; \Phi) = \sum_\xi (\omega(g, h)\Phi)(\xi)$ of Step 1 is a theta kernel.'
    steps: [theta-integrals-agree-def]
  - concept: Theta lift
    text: 'Gelbart, Piatetski-Shapiro and Rallis, Explicit Constructions of Automorphic L-functions, LNM 1254 (1987), Part A, 2'
    says: 'The theta lift of a cusp form $f$ is $\theta(\varphi, f)(g) = \int_{[G'']} \theta(g, h; \varphi)\overline{f(h)}\, dh$, an automorphic form on $G$.'
    why: 'The theta integral $I_M(\Phi)$ is the global theta lift from $\mathrm{U}(X)$ to $\mathrm{U}(W)$, and [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) compares two of them.'
    steps: [theta-integrals-agree-def]
  - concept: Theta correspondence
    math2: 6WB6TKE70H
    says: 'The local theta correspondence sends an irreducible $\pi$ of $G$ with $\Theta(\pi) \ne 0$ to the unique irreducible quotient $\theta(\pi)$ of its big theta lift.'
    why: '[LocalMatching](/step/local-matching-def/) gives quotient maps of two local Weil representations onto one irreducible representation of $\mathrm{U}(W)(F_v)$.'
    steps: [local-matching-def]
  - concept: Howe duality
    text: 'Gan and Takeda, A proof of the Howe duality conjecture, J. Amer. Math. Soc. 29 (2016)'
    says: 'If $\Theta(\pi) \ne 0$ then it has a unique irreducible quotient $\theta(\pi)$, and $\theta(\pi_1) \cong \theta(\pi_2) \ne 0$ implies $\pi_1 \cong \pi_2$.'
    why: 'The common irreducible quotient $\Pi_v$ of [LocalMatching](/step/local-matching-def/) is the form that Howe duality gives at each place.'
    steps: [local-matching-def]
