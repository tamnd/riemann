id: vwin
title: The window bound VWin
for: [vwin]
needs: [algebra, number-fields, class-field-theory, l-functions, groups, representations, automorphic-forms, galois-representations, galois-cohomology]
lead: 'To read the window bound, you need primitive Dirichlet characters and subfields of cyclotomic fields, Galois cohomology with its duality theorems, and the automorphy results that feed the counts.'
items:
  - concept: Dirichlet character
    math2: JR4QSEFXWF
    says: 'A Dirichlet character modulo $N$ is a group homomorphism $(\mathbb{Z}/N\mathbb{Z})^\times \to \mathbb{C}^\times$, extended by $0$ to the integers not prime to $N$; it is even or odd as $\chi(-1) = 1$ or $-1$.'
    why: '[VWin](/step/vwin-def/) is a statement for each primitive Dirichlet character $\psi$, a `PChar`.'
    steps: [vwin-def]
  - concept: Cyclotomic field
    math2: NN77VYSGXR
    says: 'The $N$-th cyclotomic field is $\mathbb{Q}(\zeta_N)$. It has degree $\varphi(N)$, and $a \mapsto (\zeta_N \mapsto \zeta_N^a)$ is an isomorphism $(\mathbb{Z}/N\mathbb{Z})^\times \cong \mathrm{Gal}(\mathbb{Q}(\zeta_N)/\mathbb{Q})$.'
    why: 'A field with `IsChiField` in [VWin](/step/vwin-def/) lies in a cyclotomic field $\mathbb{Q}(\zeta_N)$.'
    steps: [vwin-def]
  - concept: Fixed field
    math2: 0J1E5ZRZRM
    says: 'For a group $H$ of automorphisms of $L$, the fixed field is $L^H = \{x \in L : h(x) = x \text{ for each } h \in H\}$; for $L/K$ Galois, $H \mapsto L^H$ is a bijection from subgroups to intermediate fields.'
    why: '`IsChiField` in [VWin](/step/vwin-def/) defines $E$ as the fixed field of a set of classes $a \bmod N$.'
    steps: [vwin-def]
  - concept: Jacobi symbol
    math2: 0ADTQBXRMC
    says: 'For an odd positive $n = p_1 \cdots p_k$, the Jacobi symbol is $\left(\frac{a}{n}\right) = \prod_i \left(\frac{a}{p_i}\right)$, a product of Legendre symbols.'
    why: '`IsChiField` in [VWin](/step/vwin-def/) asks $\left(\tfrac{a}{q}\right) = \left(\tfrac{a}{d}\right) = 1$.'
    steps: [vwin-def]
  - concept: Cyclotomic character
    math2: XSGB5K2KEG
    says: 'Let $K$ be a field and let $\ell$ be a prime different from the characteristic of $K$. The $\ell$-adic cyclotomic character is the continuous homomorphism $\chi: G_K \to \mathbb{Z}_\ell^\times$ such that $\sigma(\zeta) = \zeta^{\chi(\sigma) \bmod \ell^n}$ for every $\sigma \in G_K$ and every root of unity $\zeta \in \overline{K}$ of order $\ell^n$. The twist $M(k)$ of a Galois module $M$ is $M$ with the action of $\sigma$ multiplied by $\chi(\sigma)^k$.'
    why: 'The coefficients of the groups in [VWin](/step/vwin-def/) are $\mathbb{Q}_l/\mathbb{Z}_l$ twisted by a power of the cyclotomic character.'
    steps: [vwin-def]
  - concept: Galois cohomology
    math2: 9MPCZ3EAJM
    says: 'Let $K$ be a field and let $M$ be a discrete $G_K$-module. The Galois cohomology group $H^n(K, M)$ is the cohomology of the complex of continuous cochains $G_K^n \to M$. It is the direct limit of $H^n(\operatorname{Gal}(L/K), M^{G_L})$ over finite Galois extensions $L/K$.'
    why: '[VWin](/step/vwin-def/) is about $H^1$ of a Galois group unramified outside $l$, and `LemmaK` about $H^2$.'
    steps: [vwin-def]
  - concept: Tate-Shafarevich group
    math2: BK9WBMF56G
    says: 'Let $K$ be a number field and let $M$ be a discrete $G_K$-module. The Tate-Shafarevich group is $\text{Ш}(K, M) = \ker\big(H^1(K, M) \to \prod_v H^1(K_v, M)\big)$, where $v$ runs over all places of $K$.'
    why: '`shaLen` in [VWin](/step/vwin-def/) is the length of a Tate-Shafarevich group in $H^1$.'
    steps: [vwin-def]
  - concept: Length of a module
    math2: CZSCNZH8VY
    says: 'The length $\operatorname{len}_R M$ is the number of steps of a composition series of $M$, or $\infty$ if there is none; for a finite $\mathbb{Z}_\ell$-module, $\#M = \ell^{\operatorname{len} M}$.'
    why: '[VWin](/step/vwin-def/) measures each group by its length as a $\mathbb{Z}_l$-module, a value in $\mathbb{N} \cup \{\infty\}$.'
    steps: [vwin-def]
  - concept: Plus and minus parts
    text: 'Washington, Introduction to Cyclotomic Fields, 2nd ed. (1997), ch. 6'
    says: 'For a $\mathbb{Z}_l$-module $X$ with an involution $c$ and $l$ odd, $X = X^+ \oplus X^-$ with $X^\pm = \frac{1 \pm c}{2} X$, and lengths add.'
    why: 'The count splits each length into the eigenspaces of complex conjugation (`shaLen_eq_add`), bounded by `ThmHV` and `ThmBcFree`; see [VWin from Row0b](/step/vwin-of-row/).'
    steps: [vwin-of-row]
  - concept: Local finiteness
    text: 'Neukirch, Schmidt and Wingberg, Cohomology of Number Fields, 2nd ed. (2008), ch. VII, sec. 2'
    says: 'For a finite extension $K$ of $\mathbb{Q}_p$ and a finite $G_K$-module $M$, the groups $H^n(K, M)$ are finite, and they vanish for $n \geq 3$.'
    why: '`ThmBab` and `vwin_of_counts` take local finiteness from the record `LitCoh` of [the rank n inputs](/step/v-window-of-depth-zero-residual-bc-cm/).'
    steps: [v-window-of-depth-zero-residual-bc-cm]
  - concept: Local Tate duality
    text: 'Neukirch, Schmidt and Wingberg, Cohomology of Number Fields, 2nd ed. (2008), ch. VII'
    says: 'For a finite Galois module $M$ over a p-adic field, the cup product gives a perfect pairing $H^n(K, M) \times H^{2-n}(K, M^\vee) \to \mathbb{Q}/\mathbb{Z}$, with $M^\vee = \mathrm{Hom}(M, \mu)$.'
    why: '`ThmBab` and `vwin_of_counts` take local Tate duality from `LitCoh` in [the rank n inputs](/step/v-window-of-depth-zero-residual-bc-cm/).'
    steps: [v-window-of-depth-zero-residual-bc-cm]
  - concept: Poitou-Tate duality
    text: 'Neukirch, Schmidt and Wingberg, Cohomology of Number Fields, 2nd ed. (2008), ch. VIII'
    says: 'Poitou-Tate duality is a nine-term exact sequence that links the global Galois cohomology of a finite module $M$ and of its dual $M^\vee$, and it gives a perfect pairing between $\text{Ш}^1_S(M)$ and $\text{Ш}^2_S(M^\vee)$.'
    why: '`ThmBab` and `vwin_of_counts` take Poitou-Tate duality from `LitCoh` in [the rank n inputs](/step/v-window-of-depth-zero-residual-bc-cm/).'
    steps: [v-window-of-depth-zero-residual-bc-cm]
  - concept: Ferrero-Washington theorem
    text: 'Ferrero and Washington, The Iwasawa invariant mu_p vanishes for abelian number fields, Ann. of Math. 109 (1979)'
    says: 'The Ferrero-Washington theorem says that the Iwasawa $\mu$-invariant of the cyclotomic $\mathbb{Z}_p$-extension of an abelian number field is zero.'
    why: '`ThmBab` uses a statement `ferreroWashington` to bound the parts over cyclotomic layers; see [VWin from Row0b](/step/vwin-of-row/).'
    steps: [vwin-of-row]
  - concept: Bloch-Kato Selmer group
    text: 'Bloch and Kato, L-functions and Tamagawa numbers of motives, in The Grothendieck Festschrift I (1990)'
    says: 'The Bloch-Kato Selmer group of a p-adic representation is the subgroup of $H^1$ of classes that are unramified away from $p$ and crystalline in the sense of $H^1_f$ at $p$.'
    why: '`KatoTwoW` says that Bloch-Kato Selmer groups of twists of a two-dimensional representation vanish, and feeds `CountI`.'
  - concept: Kato Euler system
    text: 'Kato, p-adic Hodge theory and values of zeta functions of modular forms, Asterisque 295 (2004)'
    says: 'Kato constructs an Euler system of Beilinson elements in the K-theory of modular curves, and it bounds Selmer groups of modular forms.'
    why: 'The proof of `KatoTwoW` has parts named after the Kato Euler system.'
  - concept: Newform
    text: 'Atkin and Lehner, Hecke operators on Gamma_0(m), Math. Ann. 185 (1970)'
    says: 'A newform is a normalized cusp form that is an eigenvector of all Hecke operators and is orthogonal to the forms from lower levels.'
    why: '`KatoTwoW` is about two-dimensional representations attached to a newform of weight $2e+1$.'
  - concept: Isobaric sum
    text: 'Jacquet and Shalika, On Euler products and the classification of automorphic representations II, Amer. J. Math. (1981)'
    says: 'The isobaric sum $\pi_1 \boxplus \dots \boxplus \pi_k$ is the automorphic representation of $\mathrm{GL}_{\sum n_i}$ whose local components are induced from the $\pi_{i,v}$, with $L(s, \boxplus \pi_i) = \prod L(s, \pi_i)$.'
    why: '[BaseChangeIsobaricN](/step/base-change-isobaric-n-def/) gives isobaric pieces of sizes $N_1 + \dots + N_c = n$.'
    steps: [base-change-isobaric-n-def]
  - concept: Base change of automorphic representations
    text: 'Arthur and Clozel, Simple Algebras, Base Change, and the Advanced Theory of the Trace Formula (1989)'
    says: 'Base change sends $\pi$ on $\mathrm{U}_n$ or $\mathrm{GL}_n(\mathbb{A}_F)$ to an isobaric $\Pi$ on $\mathrm{GL}_n(\mathbb{A}_E)$ whose local components match those of $\pi$ at split, unramified and infinite places.'
    why: '[BaseChangeIsobaricN](/step/base-change-isobaric-n-def/) is base change from $U_n$ over a CM field to $\mathrm{GL}_n$, proved by [baseChangeN](/step/base-change-n/).'
    steps: [base-change-isobaric-n-def, base-change-n]
  - concept: Modularity lifting
    math2: VQ8XNV47K9
    says: 'A modularity lifting theorem says that a Galois representation with an automorphic residual representation of large image, and with suitable local properties at $\ell$, is itself automorphic. Taylor-Wiles patching proves it by an isomorphism $R = \mathbb{T}$.'
    why: '`SymplecticFourImageDense` and `UnitaryThreeAutomorphyDense` are automorphy statements in dimensions 4 and 3 that feed `CountII`, `CountIII` and `CountV`.'
  - concept: Hida theory
    text: 'Hida, Elementary Theory of L-functions and Eisenstein Series (1993)'
    says: 'Hida theory puts ordinary cuspidal Hecke eigenforms of varying weight into p-adic analytic families over an Iwasawa algebra.'
    why: '`DenseThresholdMainCase` is a statement in a Hida setting for $2 \le n \le 4$, under `CountV`.'
