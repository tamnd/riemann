id: automorphic-forms
title: Automorphic forms and representations
for: []
needs: [complex-analysis, number-fields, representations]
lead: 'This path goes from modular forms to cuspidal automorphic representations of $\mathrm{GL}_n$. At its end, a reader can parse the input $\pi$ of the row statement.'
items:
  - concept: Modular form
    math2: GWKN5VG78A
    says: 'Let $k$ be an integer, let $\mathbb{H} = \{\tau \in \mathbb{C} : \operatorname{Im} \tau > 0\}$, and let $\Gamma$ be a subgroup of finite index in $\mathrm{SL}_2(\mathbb{Z})$, for example $\mathrm{SL}_2(\mathbb{Z})$ itself. A modular form of weight $k$ for $\Gamma$ is a holomorphic function $f: \mathbb{H} \to \mathbb{C}$ with $f\left(\frac{a\tau + b}{c\tau + d}\right) = (c\tau + d)^k f(\tau)$ for all $\begin{pmatrix} a & b \\ c & d \end{pmatrix} \in \Gamma$. It must also be holomorphic at the cusps: for every $\gamma \in \mathrm{SL}_2(\mathbb{Z})$ with bottom row $(c, d)$, the function $(c\tau + d)^{-k} f(\gamma\tau)$ stays bounded as $\operatorname{Im} \tau \to \infty$.'
    why: 'Modular forms are the case of $\mathrm{GL}_2$ over $\mathbb{Q}$, and the vwin counts use newforms of weight $2e+1$.'
  - concept: Cusp form
    math2: A50Y012RBP
    says: 'Let $f$ be a modular form of weight $k$ for a subgroup $\Gamma$ of finite index in $\mathrm{SL}_2(\mathbb{Z})$. Then $f$ is a cusp form when, for every $\gamma \in \mathrm{SL}_2(\mathbb{Z})$ with bottom row $(c, d)$, the function $(c\tau + d)^{-k} f(\gamma\tau)$ tends to $0$ as $\operatorname{Im} \tau \to \infty$. For $\Gamma = \mathrm{SL}_2(\mathbb{Z})$, this means that $f(\tau) = \sum_{n \ge 0} a_n e^{2\pi i n\tau}$ has $a_0 = 0$.'
    why: 'The unitary hypotheses in [nonempty-hyps](/step/nonempty-hyps/) contain many named results on cusp forms.'
    steps: [nonempty-hyps]
  - concept: Eisenstein series
    math2: 3NZBZXYWAJ
    says: 'Let $k \ge 4$ be an even integer and let $\mathbb{H}$ be the upper half-plane. The Eisenstein series of weight $k$ is the function $G_k(\tau) = \sum_{(m, n) \in \mathbb{Z}^2 \setminus \{(0, 0)\}} (m\tau + n)^{-k}$ on $\mathbb{H}$. The series converges absolutely, and $G_k$ is a modular form of weight $k$ for $\mathrm{SL}_2(\mathbb{Z})$ that is not a cusp form.'
    why: 'The theta branch of the [literature chapter](/proof/literature/) uses statements named `EisBL` and `SiegelWeilStd`, on Eisenstein series and the Siegel-Weil formula.'
  - concept: Hecke operator
    math2: S4SV3QZ8B1
    says: 'Let $M_k$ be the space of modular forms of weight $k$ for $\mathrm{SL}_2(\mathbb{Z})$ and let $n \ge 1$. The Hecke operator $T_n: M_k \to M_k$ is $(T_n f)(\tau) = n^{k-1} \sum d^{-k} f\left(\frac{a\tau + b}{d}\right)$, where the sum runs over the integers $a, d \ge 1$ with $ad = n$ and $0 \le b < d$. For a group $G$ with a compact open subgroup $K$ and a smooth representation $\pi$ of $G$, the Hecke operator of a double coset $KgK$ acts on the $K$-fixed vectors by $v \mapsto \int_{KgK} \pi(x) v \, dx$.'
    why: 'Hecke operators at unramified places have eigenvalues, and the Galois row relates them to Frobenius elements through Satake parameters.'
  - concept: Hecke algebra
    math2: 5J2P2AGY4N
    says: 'Let $G$ be a locally compact totally disconnected group, for example $\mathrm{GL}_n(F)$ for a $p$-adic field $F$, and let $K$ be a compact open subgroup with Haar measure $dg$ on $G$. The Hecke algebra $\mathcal{H}(G, K)$ is the space of compactly supported functions $f: G \to \mathbb{C}$ with $f(k_1 g k_2) = f(g)$ for all $k_1, k_2 \in K$, with the product $(f_1 * f_2)(x) = \int_G f_1(g) f_2(g^{-1} x) \, dg$. For $G = \mathrm{GL}_n(F)$ and $K = \mathrm{GL}_n(\mathcal{O}_F)$, it is the spherical Hecke algebra, and it is commutative.'
    why: 'The spherical Hecke algebra acts on unramified vectors, and its characters are the Satake parameters.'
  - concept: Automorphic form
    math2: 68SJQEC11F
    says: 'Let $G$ be a connected semisimple Lie group with finite center inside $\mathrm{GL}_n(\mathbb{R})$, let $K$ be a maximal compact subgroup, and let $\Gamma \subseteq G$ be an arithmetic subgroup. An automorphic form for $\Gamma$ is a smooth function $f: G \to \mathbb{C}$ with $f(\gamma g) = f(g)$ for all $\gamma \in \Gamma$, such that the right translates of $f$ by $K$ span a finite-dimensional space, an ideal of finite codimension in the center of the universal enveloping algebra kills $f$, and $|f(g)| \le C \|g\|^N$ for some constants $C, N > 0$. Here $\|g\|$ is the largest absolute value of an entry of $g$ or $g^{-1}$.'
    why: 'The theta integrals of the [theta chapter](/proof/theta-matching/) are automorphic forms on unitary groups.'
  - concept: Cuspidal automorphic representation
    math2: null
    proposal: https://github.com/tamnd/math2/issues/383
    says: 'A cuspidal automorphic representation is an irreducible constituent of the space of cusp forms on $G(F) \backslash G(\mathbb{A}_F)$.'
    text: 'Borel and Jacquet, Automorphic forms and automorphic representations, Proc. Sympos. Pure Math. 33 (1979)'
    why: 'The row statement [Row0b](/step/row0b-def/) takes a cuspidal subspace $\pi$ of automorphic forms on $\mathrm{GL}_a$.'
    steps: [row0b-def]
  - concept: Satake parameters
    math2: null
    proposal: https://github.com/tamnd/math2/issues/384
    says: 'The Satake parameters of an unramified representation are the conjugacy class in the dual group that its spherical Hecke eigencharacter gives under the Satake isomorphism.'
    text: 'Cartier, Representations of p-adic groups, a survey, Proc. Sympos. Pure Math. 33 (1979)'
    why: 'The statement `CoreAll` of the [Galois row chapter](/proof/galois-row/) compares Satake parameters with Frobenius characteristic polynomials.'
  - concept: Regular algebraic automorphic representation
    math2: null
    proposal: https://github.com/tamnd/math2/issues/385
    says: 'An automorphic representation of $\mathrm{GL}_n$ is regular algebraic when its infinitesimal character at infinity is that of an algebraic representation with distinct weights.'
    text: 'Clozel, Motifs et formes automorphes, in Automorphic Forms, Shimura Varieties and L-functions I (1990)'
    why: 'The row statement [Row0b](/step/row0b-def/) asks that $\pi$ is regular algebraic.'
    steps: [row0b-def]
  - concept: Polarized automorphic representation
    math2: null
    proposal: https://github.com/tamnd/math2/issues/386
    says: 'A polarized pair $(\pi, \chi)$ is a representation $\pi$ of $\mathrm{GL}_n$ over a CM field with $\pi^c \cong \pi^\vee \otimes (\chi \circ N)$ and a sign condition on $\chi$.'
    text: 'Clozel, Harris and Taylor, Automorphy for some l-adic lifts of automorphic mod l Galois representations, Publ. IHES (2008)'
    why: 'The row statement [Row0b](/step/row0b-def/) asks that $(\pi, \chi)$ is a `PolarizedPair`.'
    steps: [row0b-def]
  - concept: Base change of automorphic representations
    math2: null
    proposal: https://github.com/tamnd/math2/issues/405
    says: 'Let $E/F$ be a finite cyclic extension of number fields. Base change sends an automorphic representation $\pi$ of $\mathrm{GL}_n(\mathbb{A}_F)$ to an automorphic representation $\Pi$ of $\mathrm{GL}_n(\mathbb{A}_E)$ such that, for almost all places $w$ of $E$ over a place $v$ of $F$, the L-parameter of $\Pi_w$ is the restriction to the Weil group $W_{E_w}$ of the L-parameter of $\pi_v$. Arthur and Clozel proved that such a $\Pi$ exists, and $\Pi$ is isobaric.'
    why: 'The vwin chain uses `baseChangeN`, named as an isobaric base change to $\mathrm{GL}_n$, in [vwin-of-row](/step/vwin-of-row/).'
    steps: [vwin-of-row]
  - concept: Strong multiplicity one
    math2: null
    proposal: https://github.com/tamnd/math2/issues/387
    says: 'Two cuspidal automorphic representations of $\mathrm{GL}_n$ that agree at almost all places are equal.'
    text: 'Jacquet and Shalika, On Euler products and the classification of automorphic representations I, Amer. J. Math. (1981)'
    why: 'The structure `HypothesesH''` of the [vwin chapter](/proof/vwin/) lists strong multiplicity one among its named inputs.'
