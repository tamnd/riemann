id: algebra
title: Algebra
order: 1
needs: []
lead: 'The algebra that the rest of the proof assumes: congruences, groups and their characters, modules and their length, fields, finite fields and Galois theory, matrices and minors, Hermitian forms, tensor products and coinvariants.'
items:
  - concept: Greatest common divisor
    math2: 0C8WYW4KYQ
    says: 'For $a, b \in \mathbb{Z}$ not both $0$, $\gcd(a, b)$ is the largest integer that divides both; by the Bézout identity it is $ax + by$ for some $x, y \in \mathbb{Z}$.'
    why: 'The last step of [CM divisibility](/proof/cm-divisibility/) takes a gcd of periods.'
  - concept: Unit group
    math2: 07C6ECNJET
    says: 'The unit group $(\mathbb{Z}/N\mathbb{Z})^\times$ is the set of classes $a \bmod N$ with $\gcd(a, N) = 1$; its order is $\varphi(N)$.'
    why: 'The field of `IsChiField` in [VWin](/step/vwin-def/) is cut out by congruence conditions on $a \in (\mathbb{Z}/N\mathbb{Z})^\times$.'
    steps: [vwin-def]
  - concept: Automorphism group
    math2: 0K1SCPBNKJ
    says: 'The automorphism group of a structure is the group of bijections that preserve it, with inverses that preserve it, under composition.'
    why: 'The Galois group in [Row0b](/step/row0b-def/) is the group of $E$-automorphisms of an algebraic closure.'
    steps: [row0b-def]
  - concept: Cyclic group
    math2: 0KVGH0J5B3
    says: 'A group is cyclic if it is generated by one element; it is then isomorphic to $\mathbb{Z}$ or to $\mathbb{Z}/n\mathbb{Z}$.'
    why: 'The statement [GeoOne](/step/geo-one-def/) maps an open compact group onto the cyclic group $\mathbb{Z}/\ell^m$.'
    steps: [geo-one-def]
  - concept: Character of an abelian group
    math2: H1WNVN5V7F
    says: 'A character of a finite abelian group $A$ is a homomorphism $\chi : A \to \mathbb{C}^\times$; $\sum_{a \in A} \chi(a)$ is $|A|$ for $\chi = 1$ and $0$ otherwise.'
    why: 'The statement [GeoOne](/step/geo-one-def/) uses a nontrivial character of $\mathbb{Z}/\ell^m$.'
    steps: [geo-one-def]
  - concept: Multiset
    math2: MYJ8Y050J0
    says: 'A multiset on a set $S$ is a function $S \to \mathbb{Z}_{\ge 0}$ with finite support, the multiplicity of each element.'
    why: 'The Hodge-Tate weights in [Row0b](/step/row0b-def/) form a multiset of integers for each embedding.'
    steps: [row0b-def]
  - concept: Ideal
    math2: 096Z9MP2ME
    says: 'An ideal of a ring $R$ is an additive subgroup $I$ with $rI \subseteq I$ for each $r \in R$; it is maximal if $R/I$ is a field.'
    why: 'The formal group computations of [CM divisibility](/proof/cm-divisibility/) work modulo an ideal.'
  - concept: Torsion subgroup
    math2: 0DBWXQRXQJ
    says: 'The torsion subgroup of a module $M$ over a domain $R$ is the set of $m$ with $rm = 0$ for some $r \ne 0$.'
    why: 'The statement [GeoOne](/step/geo-one-def/) asks for an open compact subgroup with no torsion.'
    steps: [geo-one-def]
  - concept: Length of a module
    math2: CZSCNZH8VY
    says: 'The length $\operatorname{len}_R M$ is the number of steps of a composition series of $M$, or $\infty$ if there is none; for a finite $\mathbb{Z}_\ell$-module, $\#M = \ell^{\operatorname{len} M}$.'
    why: 'The window bound [VWin](/step/vwin-def/) bounds $\sum_\ell \log \ell \cdot \operatorname{len}_{\mathbb{Z}_\ell}$ of Tate-Shafarevich groups.'
    steps: [vwin-def]
  - concept: Polynomial ring
    math2: 0SDC934R52
    says: 'The polynomial ring $R[X]$ is the ring of finite sums $\sum_i a_i X^i$ with $a_i \in R$.'
    why: 'The prime labels of [Green](/step/green-def/) are monic irreducible polynomials over $\mathbb{Z}/g$ with nonzero constant term.'
    steps: [green-def]
  - concept: Formal power series
    math2: 033WGN00BF
    says: 'The ring $R[[X_1, \dots, X_d]]$ is the set of all formal sums $\sum_\alpha a_\alpha X^\alpha$, with no convergence asked.'
    why: 'A formal group law in [CM divisibility](/proof/cm-divisibility/) is a tuple of power series.'
  - concept: Minimal polynomial
    math2: 03NDVCSHSB
    says: 'The minimal polynomial of an algebraic $\alpha$ over $K$ is the monic $f \in K[X]$ of least degree with $f(\alpha) = 0$; it is irreducible and $[K(\alpha) : K] = \deg f$.'
    why: 'The proof [GreenOfRegular](/step/green-of-regular/) takes the minimal polynomial of an element of $\mathbb{F}_{g^d}$.'
    steps: [green-of-regular]
  - concept: Algebraic closure
    math2: 0X6AB5P3G1
    says: 'An algebraic closure of $K$ is an algebraically closed extension in which each element is algebraic over $K$; it exists and is unique up to isomorphism over $K$.'
    why: 'The Galois representations of [Row0b](/step/row0b-def/) take values in $\mathrm{GL}_a(\overline{\mathbb{Q}}_\ell)$.'
    steps: [row0b-def]
  - concept: Finite field
    math2: 0ZXZ82FTX2
    says: 'For each prime power $q$ there is a field $\mathbb{F}_q$ with $q$ elements, unique up to isomorphism, and $\mathbb{F}_q^\times$ is cyclic.'
    why: 'The statement [Green](/step/green-def/) is about the cuspidal characters of $\mathrm{GL}_d(\mathbb{F}_g)$.'
    steps: [green-def]
  - concept: Frobenius automorphism
    math2: 0CGCPX8Z70
    says: 'The Frobenius automorphism of $\mathbb{F}_{q^d}$ over $\mathbb{F}_q$ is $x \mapsto x^q$; it generates the cyclic group $\mathrm{Gal}(\mathbb{F}_{q^d}/\mathbb{F}_q)$ of order $d$.'
    why: 'The value formula of [Green](/step/green-def/) sums a character over the Frobenius conjugates $z^{g^i}$.'
    steps: [green-def, green-of-regular]
  - concept: Primitive root of unity
    math2: 0EHM5ZP5QH
    says: 'A primitive root of unity of order $n$ in a field $K$ is an element of order exactly $n$ in $K^\times$.'
    why: 'The statement `IsChiField` in [VWin](/step/vwin-def/) fixes a primitive $N$-th root of unity.'
    steps: [vwin-def]
  - concept: Fixed field
    math2: 0J1E5ZRZRM
    says: 'For a group $H$ of automorphisms of $L$, the fixed field is $L^H = \{x \in L : h(x) = x \text{ for each } h \in H\}$; for $L/K$ Galois, $H \mapsto L^H$ is a bijection from subgroups to intermediate fields.'
    why: 'The field $E$ of `IsChiField` in [VWin](/step/vwin-def/) is a fixed field inside $\mathbb{Q}(\zeta_N)$.'
    steps: [vwin-def]
  - concept: Determinant
    math2: 00KDZRW4C0
    says: 'The determinant of $A \in M_n(R)$ is $\sum_{\sigma \in S_n} \operatorname{sgn}(\sigma) \prod_i a_{i,\sigma(i)}$; it is multiplicative, and $A$ is invertible if and only if $\det A$ is a unit.'
    why: 'The test vector of [block determinants](/proof/determinants/) is a product of powers of determinants of minors.'
  - concept: Characteristic polynomial
    math2: 0VSSPAFM2C
    says: 'The characteristic polynomial of $A \in M_n(R)$ is $\det(X \cdot 1 - A)$, monic of degree $n$.'
    why: 'The statement [GeoOne](/step/geo-one-def/) asks that a Frobenius characteristic polynomial divide a power.'
    steps: [geo-one-def, green-def]
  - concept: Leading principal minor
    math2: 0BT9BYWVRY
    says: 'The leading principal minor $\Delta_s(A)$ is the determinant of the top left $s \times s$ block; $\Delta_s(xb) = \Delta_s(x) b_{11} \cdots b_{ss}$ for upper triangular $b$.'
    why: 'The highest weight vector of [block determinants](/proof/determinants/) is $\prod_s \Delta_s^{\nu_s - \nu_{s+1}}$.'
  - concept: Block matrix
    math2: 0ASDFEQS6P
    says: 'A block matrix is a matrix written as an array of submatrices; a block triangular matrix has determinant the product of the determinants of its diagonal blocks.'
    why: 'The cuspidal condition of [Green](/step/green-def/) averages over block unipotent matrices.'
    steps: [green-def]
  - concept: Nilpotent
    math2: 07BSPZPSMF
    says: 'A matrix $A$ is nilpotent if $A^k = 0$ for some $k$; over a field this holds if and only if its characteristic polynomial is $X^n$.'
    why: '[CM divisibility](/proof/cm-divisibility/) shows that a dual Frobenius matrix is nilpotent.'
  - concept: Gram matrix
    math2: 00SPJSDT3Z
    says: 'The Gram matrix of $v_1, \dots, v_k$ for a form $h$ is $(h(v_i, v_j))_{i,j}$; in a basis, $h(x, y) = x^T J \sigma(y)$.'
    why: 'The spaces of [TLiftK](/step/tlift-k-def/) are given by Gram matrices, and the [Siegel-Weil chapter](/proof/siegel-weil/) integrates over vectors with a fixed Gram matrix.'
    steps: [tlift-k-def]
  - concept: Hermitian form
    math2: 8NJ7XY6F1S
    says: 'A Hermitian form is a sesquilinear form $h$ with $h(y, x) = \sigma(h(x, y))$.'
    why: 'The space $X$ of [TLiftK](/step/tlift-k-def/) is Hermitian with Gram matrix $1$.'
    steps: [tlift-k-def]
  - concept: Skew-Hermitian form
    text: 'Scharlau, Quadratic and Hermitian Forms, 7.1'
    says: 'A skew-Hermitian form is a sesquilinear form $h$ with $h(y, x) = -\sigma(h(x, y))$.'
    why: 'The space $W$ of [TLiftK](/step/tlift-k-def/) is skew-Hermitian with Gram matrix $\delta \cdot 1$.'
    steps: [tlift-k-def]
  - concept: Signature
    math2: 07EZA80NEH
    says: 'The signature $(p, q)$ of a Hermitian form over $\mathbb{C}$ counts the $+1$ and $-1$ entries of a diagonal Gram matrix; by Sylvester it does not depend on the basis.'
    why: 'In [TLiftK](/step/tlift-k-def/) the form $iJ$ of the skew-Hermitian space has signature $(d, 0)$.'
    steps: [tlift-k-def]
  - concept: Hyperbolic plane
    math2: 1X5PZSK44P
    says: 'A hyperbolic plane is a space with basis $x, y$ such that $h(x, x) = h(y, y) = 0$ and $h(x, y) = 1$; each isotropic vector of a nondegenerate space lies in one, with a nondegenerate orthogonal complement.'
    why: 'The recursion steps of [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) split a hyperbolic plane off a space.'
    steps: [theta-integrals-agree-def]
  - concept: Pure tensor
    math2: F0HQXQ0HCD
    says: 'The tensor product $M \otimes_R N$ is the universal target of bilinear maps on $M \times N$; a pure tensor is an element $m \otimes n$.'
    why: 'The matching condition of [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) compares pure tensors of local test functions.'
    steps: [theta-integrals-agree-def]
  - concept: Coinvariants
    text: 'Lang, Algebra, XVI'
    says: 'The coinvariants of a representation $V$ of $G$ are $V_G = V / \operatorname{span}\{gv - v\}$; the invariant linear forms on $V$ are the linear forms on $V_G$.'
    why: 'The statement [ThetaIntegralsAgree](/step/theta-integrals-agree-def/) asks that the kernel of each local map $p_v$ be a space of coinvariants.'
    steps: [theta-integrals-agree-def]
  - concept: Zorn's lemma
    math2: 04RXTQA5ZA
    says: 'A nonempty partially ordered set in which each chain has an upper bound has a maximal element.'
    why: 'The proof `projEx` in [block determinants](/proof/determinants/) uses it to project an automorphic form onto an irreducible constituent.'
