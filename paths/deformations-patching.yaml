id: deformations-patching
title: Galois deformations, patching and automorphy lifting
order: 29
needs: [commutative-algebra, galois-cohomology, galois-representations, automorphic-forms, padic-hodge, geometry, etale-cohomology]
lead: 'Deformation rings of Galois representations, Hecke algebras and $R = \mathbb{T}$ theorems, Taylor-Wiles-Kisin patching, automorphy lifting and potential automorphy, with the Galois representations of Shimura varieties that the method starts from. The proof uses this material for the Galois row and for the automorphy inputs of the window bound.'
items:
  - concept: Artinian ring
    math2: 20QEAM8AX2
    says: 'A ring is Artinian if each descending chain of ideals stabilizes; a local Artinian $\mathcal{O}$-algebra with residue field $k$ is a test object of deformation theory.'
    why: 'Deformation functors are first defined on the category $\mathrm{Art}_\mathcal{O}$ of such rings and then pro-represented by complete local rings.'
  - concept: Cotangent space
    math2: Z1CGB483J6
    says: 'The cotangent space of a local ring $(A, \mathfrak{m})$ with residue field $k$ is the $k$-vector space $\mathfrak{m}/\mathfrak{m}^2$.'
    why: 'The tangent space of a deformation ring is the dual of its relative cotangent space, which counts the generators of the ring over $\mathcal{O}$.'
  - concept: Schlessinger's criterion
    text: 'M. Schlessinger, Functors of Artin rings, Trans. Amer. Math. Soc. 130 (1968), Theorem 2.11'
    says: 'A functor $F$ on $\mathrm{Art}_\mathcal{O}$ with $F(k)$ a point has a hull if and only if conditions (H1), (H2) and (H3) hold, and is pro-representable if and only if (H1) to (H4) hold.'
    why: 'It gives the existence of framed and universal deformation rings, see [deformation theory in the geometry chapter](/learn/geometry/) for the geometric analogue.'
  - concept: Universal deformation ring
    math2: H8AAQJ1SZW
    says: 'If $G$ satisfies $\Phi_\ell$ and $\mathrm{End}_{k[G]}(\bar\rho) = k$, then the deformations of $\bar\rho$ are pro-represented by a ring $R_{\bar\rho}$ in $\mathrm{CNL}_\mathcal{O}$ (Mazur, Deforming Galois representations, 1989, section 1).'
    why: 'Every $R = \mathbb{T}$ theorem behind the automorphy inputs of [the window bound](/proof/vwin/) is a statement about a quotient of such a ring.'
    steps: [vwin-def]
  - concept: Tangent space and obstructions
    text: 'B. Mazur, Deforming Galois representations, in Galois Groups over Q, MSRI Publ. 16 (1989), section 1'
    says: 'The tangent space of $R_{\bar\rho}$ is $H^1(G, \mathrm{ad}\,\bar\rho)$, and $R_{\bar\rho}$ is a quotient of $\mathcal{O}[[x_1, \dots, x_{h^1}]]$ by at most $h^2 = \dim H^2(G, \mathrm{ad}\,\bar\rho)$ relations.'
    why: 'With the Euler characteristic formulas of [Galois cohomology](/learn/galois-cohomology/) it gives the lower bound $\dim R_{\bar\rho} \ge 1 + h^1 - h^2$.'
  - concept: Krull's principal ideal theorem
    math2: SJZW2HN1SC
    says: 'In a noetherian ring, a minimal prime over an ideal generated by $r$ elements has height at most $r$.'
    why: 'It turns the bound on the number of relations of a deformation ring into a lower bound on its dimension.'
  - concept: Polarized deformations
    text: 'L. Clozel, M. Harris and R. Taylor, Automorphy for some l-adic lifts of automorphic mod l Galois representations, Publ. Math. IHES 108 (2008), section 2'
    says: 'Representations $\bar\rho$ of $G_F$ with $\bar\rho^c \cong \bar\rho^\vee \otimes \bar\mu$, for $F$ a CM field, extend to homomorphisms $G_{F^+} \to \mathcal{G}_n(k)$, and their deformations have tangent space $H^1(G_{F^+,S}, \mathrm{ad}\,\bar r)$.'
    why: 'These are the deformations that match automorphic forms on unitary groups, as in [the unitary hypotheses](/proof/unitary-hypotheses/).'
    steps: [hyps-alt-def]
  - concept: Potentially semistable deformation rings
    text: 'M. Kisin, Potentially semi-stable deformation rings, J. Amer. Math. Soc. 21 (2008)'
    says: 'For a Hodge type $\mathbf{v}$ and an inertial type $\tau_0$, there is a reduced $\ell$-torsion free quotient of $R^\square_{\bar\rho}$ whose characteristic zero points are the potentially semistable lifts of that type; with regular weights its generic fibre is equidimensional of dimension $n^2 + [K : \mathbb{Q}_\ell]\, n(n-1)/2$.'
    why: 'These local rings give the condition at $\ell$ in global deformation problems, matching the conditions of [p-adic Hodge theory](/learn/padic-hodge/) in [Row0b](/step/row0b-def/).'
    steps: [row0b-def]
  - concept: Ordinary lifting rings
    text: 'D. Geraghty, Modularity lifting theorems for ordinary Galois representations, Math. Ann. 373 (2019), section 3'
    says: 'There is a quotient of $R^\square_{\bar\rho} \hat\otimes \Lambda_K$ whose points are the lifts with a full invariant flag on which inertia acts by the characters of weight space, and its components all have the same dimension.'
    why: 'The universal ordinary determinant rings in the Hida settings of [the window bound](/proof/vwin/) are the determinant forms of these rings.'
    steps: [vwin-def]
  - concept: Selmer group
    math2: 36YNSTESMQ
    says: 'For local conditions $L_v \subseteq H^1(G_{F_v}, M)$, the Selmer group $H^1_\mathcal{L}(G_{F,S}, M)$ is the set of global classes whose restriction at each $v \in S$ lies in $L_v$.'
    why: 'The tangent space of a global deformation ring with local conditions is the Selmer group of $\mathrm{ad}\,\bar\rho$, and at characteristic zero points it is the Bloch-Kato Selmer group of [Galois cohomology](/learn/galois-cohomology/).'
  - concept: Determinants
    text: 'G. Chenevier, The p-adic analytic space of pseudocharacters of a profinite group, and pseudorepresentations over arbitrary rings, LMS Lecture Note Ser. 414 (2014)'
    says: 'A determinant of dimension $d$ is a multiplicative polynomial law $A[G] \to A$ homogeneous of degree $d$; over an algebraically closed field determinants correspond to semisimple representations, and residual determinants have universal deformation rings.'
    why: 'The universal ordinary determinant rings of [the window bound](/proof/vwin/) and the [determinants](/proof/determinants/) chapter use this notion near reducible points.'
    steps: [vwin-def]
  - concept: Pseudocharacters and their limits
    text: 'R. Taylor, Galois representations associated to Siegel modular forms of low weight, Duke Math. J. 63 (1991), section 1'
    says: 'Over a field of characteristic $0$, a continuous pseudocharacter of dimension $d$ is the trace of a unique semisimple representation, and a pointwise limit of pseudocharacters is a pseudocharacter.'
    why: 'Constructions of Galois representations by congruences, as in [the Galois row](/proof/galois-row/), pass to such limits.'
    steps: [galois-row-holds]
  - concept: Representations from traces
    text: 'H. Carayol, Formes modulaires et representations galoisiennes a valeurs dans un anneau local complet, Contemp. Math. 165 (1994); L. Nyssen, Pseudo-representations, Math. Ann. 306 (1996)'
    says: 'If the residual representation is absolutely irreducible, a pseudocharacter over a complete local ring is the trace of a representation, unique up to conjugation.'
    why: 'It gives the Galois representation over a localized Hecke algebra and identifies $R_{\bar\rho}$ with the universal determinant ring.'
  - concept: Ribet's lemma
    text: 'K. Ribet, A modular construction of unramified p-extensions of Q(mu_p), Invent. Math. 34 (1976)'
    says: 'An irreducible two-dimensional $\ell$-adic representation whose reduction has semisimplification $\bar\psi_1 \oplus \bar\psi_2$ has a stable lattice whose reduction is a non-split extension of $\bar\psi_2$ by $\bar\psi_1$.'
    why: 'It turns congruences with Eisenstein series into nonzero classes in Selmer groups of characters, the mechanism behind counts at reducible points.'
  - concept: Eichler-Shimura relation
    text: 'F. Diamond and J. Shurman, A First Course in Modular Forms, chapter 8'
    says: 'For $p \nmid N$, the reduction of $T_p$ on $J_0(N)$ over $\mathbb{F}_p$ equals $\mathrm{Frob}_p + p\,\mathrm{Frob}_p^{-1}$.'
    why: 'It gives the Frobenius characteristic polynomials of the Galois representations of modular forms, the simplest case of [Row0b](/step/row0b-def/).'
    steps: [row0b-def]
  - concept: Shimura variety
    math2: QT4CF7ZKK5
    says: 'For unitary similitude groups of signature $(1, n-1)$ at one real place and $(0, n)$ at the others, the Shimura varieties are proper and smooth of dimension $n-1$, and their cohomology contains the Galois representations of the corresponding automorphic representations (Harris and Taylor, Annals of Math. Studies 151).'
    why: 'Representations found in the cohomology of such moduli spaces are the seeds of the Galois row in [the Galois row](/proof/galois-row/).'
    steps: [galois-row-holds]
  - concept: Definite unitary group
    math2: 0R9R0Y1HDK
    says: 'A unitary group over $F^+$ that is compact at all real places has automorphic forms that are functions on a finite set $G(F^+) \backslash G(\mathbb{A}^\infty_{F^+})/U$.'
    why: 'Patching is carried out with the spaces $S(U, W)$ of algebraic modular forms on such a group.'
  - concept: Hecke operator
    math2: S4SV3QZ8B1
    says: 'At a split place $w$, the operator $T_w^{(j)}$ is the double coset of $\mathrm{diag}(\varpi_w 1_j, 1_{n-j})$, and the Frobenius characteristic polynomial of the attached representation is $\sum_j (-1)^j (\mathbf{N}w)^{j(j-1)/2} T_w^{(j)} X^{n-j}$.'
    why: 'This formula makes the map from the deformation ring to the Hecke algebra surjective.'
  - concept: Hecke algebra
    math2: 5J2P2AGY4N
    says: 'The Hecke algebra $\mathbb{T}$ generated by the $T_w^{(j)}$ on $S(U, W)$ is commutative and finite over $\mathcal{O}$, and at a non-Eisenstein maximal ideal $\mathfrak{m}$ it carries a Galois representation $r_\mathfrak{m}$.'
    why: 'An isomorphism $R^{\mathrm{red}} = \mathbb{T}_\mathfrak{m}$ proves that every lift of the given type is automorphic.'
  - concept: Wiles numerical criterion
    text: 'A. Wiles, Modular elliptic curves and Fermat''s Last Theorem, Ann. of Math. 141 (1995); H. Lenstra, Complete intersections and Gorenstein rings (1995)'
    says: 'For a surjection $R \to \mathbb{T}$ with $\mathbb{T}$ finite flat over $\mathcal{O}$ and an augmentation $\mathbb{T} \to \mathcal{O}$, one has $\#\Phi_R \ge \#\mathcal{O}/\eta_\mathbb{T}$, with equality only if $R \to \mathbb{T}$ is an isomorphism of complete intersections.'
    why: 'It links $R = \mathbb{T}$ theorems to the size of adjoint Selmer groups, which the ordinary vanishing statements of the development volumes use.'
  - concept: Taylor-Wiles primes
    text: 'H. Darmon, F. Diamond and R. Taylor, Fermat''s Last Theorem, chapter on Hecke algebras'
    says: 'If $\bar\rho|_{G_{\mathbb{Q}(\sqrt{\ell^*})}}$ is absolutely irreducible, then for each $N$ there are $r$ primes $q \equiv 1 \bmod \ell^N$ with $\bar\rho(\mathrm{Frob}_q)$ regular semisimple that kill the dual Selmer group, and the augmented deformation rings are generated by $r$ elements.'
    why: 'The Greenberg-Wiles formula of [Galois cohomology](/learn/galois-cohomology/) balances the number of generators against the number of diamond variables.'
  - concept: Depth
    math2: M2RADBFW99
    says: 'If a finite module $M$ over a noetherian local ring $A$ has depth at least $\dim A$, then each associated prime of $M$ is a minimal prime of maximal dimension, so $\mathrm{Supp}\, M$ is a union of irreducible components (Matsumura, Commutative Ring Theory, Theorem 17.2).'
    why: 'In Kisin''s patching this shows that the patched module is supported on whole components of the patched deformation ring, see [commutative algebra](/learn/commutative-algebra/).'
  - concept: Patching
    text: 'M. Kisin, Moduli of finite flat group schemes and modularity, Ann. of Math. 170 (2009); F. Diamond, The Taylor-Wiles construction and multiplicity one, Invent. Math. 128 (1997)'
    says: 'A limit of Hecke modules at auxiliary levels gives a module $M_\infty$ over $R_\infty = R^{\mathrm{loc}}[[x_1, \dots, x_g]]$, finite free over a power series ring of the same dimension, and if $\mathrm{Spec}\, R_\infty$ is irreducible then $R^{\mathrm{red}} = \mathbb{T}_\mathfrak{m}$.'
    why: 'The package `HypothesesH''` that [the window bound](/proof/vwin/) builds from patching rests on theorems of this form.'
    steps: [hyps-alt-def, vwin-def]
  - concept: Adequate subgroups
    text: 'J. Thorne, On the automorphy of l-adic Galois representations with small residual image, J. Inst. Math. Jussieu 11 (2012)'
    says: 'A finite irreducible $H \subset \mathrm{GL}_n(k)$ is adequate if $H^1(H, k) = H^1(H, \mathrm{ad}) = 0$ and its semisimple elements span $\mathrm{End}(k^n)$; this holds for all irreducible $H$ when $\ell \ge 2(n+1)$.'
    why: 'Adequacy of the residual image is the hypothesis under which Taylor-Wiles places exist for unitary groups.'
  - concept: Potential diagonalizability
    text: 'T. Barnet-Lamb, T. Gee, D. Geraghty and R. Taylor, Potential automorphy and change of weight, Ann. of Math. 179 (2014), section 1'
    says: 'A potentially crystalline representation is potentially diagonalizable if after a finite extension it lies on the same component of a crystalline lifting ring as a sum of crystalline characters; ordinary and Fontaine-Laffaille representations are of this kind.'
    why: 'It is the condition at $\ell$ in the automorphy lifting theorem stated in [Galois representations](/learn/galois-representations/).'
  - concept: Modularity lifting
    math2: VQ8XNV47K9
    says: 'A polarized $\ell$-adic representation of $G_F$, $F$ CM, with adequate residual image, potentially diagonalizable at $\ell$ and residually automorphic, is automorphic (Barnet-Lamb, Gee, Geraghty and Taylor, 2014, section 4).'
    why: 'Automorphy lifting in dimensions $3$ and $4$ supplies the automorphic points that the counts of [the window bound](/proof/vwin/) use.'
    steps: [vwin-def]
  - concept: Moret-Bailly's theorem
    text: 'L. Moret-Bailly, Groupes de Picard et problemes de Skolem II, Ann. Sci. ENS 22 (1989)'
    says: 'A smooth geometrically irreducible variety over $F$ with $v$-adic points in given open sets for $v \in S$ has a point over a finite Galois extension in which each $v \in S$ splits, linearly disjoint from a given field.'
    why: 'It finds a member of the Dwork family with prescribed residual representations, the first step of potential automorphy.'
  - concept: Potential automorphy
    text: 'M. Harris, N. Shepherd-Barron and R. Taylor, A family of Calabi-Yau varieties and potential automorphy, Ann. of Math. 171 (2010)'
    says: 'A polarized representation with irreducible residual image and suitable conditions at $\ell$ becomes automorphic over a finite CM extension, and then its $L$-function has meromorphic continuation by Solomon''s induction theorem.'
    why: 'The potential modularity towers of the development volumes, which feed [HypsAlt](/step/hyps-alt-def/), follow this method.'
    steps: [hyps-alt-def]
