id: geometry
title: Algebraic and complex geometry
order: 14
needs: [elliptic-curves]
lead: 'Schemes and line bundles, the vanishing theorems and resolution of singularities, Dolbeault cohomology with the holomorphic Lefschetz formula and the Kodaira-Spencer map, étale and de Rham cohomology, and Shimura varieties with their toroidal compactifications.'
items:
  - concept: Scheme
    math2: 5A35TYZD02
    says: 'A scheme is a locally ringed space that is locally isomorphic to $\mathrm{Spec}\, R$ for commutative rings $R$.'
    why: 'The integral models of unitary Shimura varieties in [the Weil bound](/proof/weil-bound/) are schemes over rings of integers.'
  - concept: Smooth projective scheme
    math2: EXKGG9X6J0
    says: 'A smooth projective scheme over $S$ is a morphism $X \to S$ that is smooth (flat with geometrically regular fibres) and factors through a closed immersion into $\mathbb{P}^N_S$.'
    why: 'The holomorphic Lefschetz formula of [the Galois row](/proof/galois-row/) is for smooth projective schemes over $\mathbb{C}$.'
    steps: [geo-one-holds]
  - concept: Product of projective spaces
    text: 'Hartshorne, Algebraic Geometry, II.5 and II.7'
    says: 'A product of projective spaces is $\mathbb{P}^{n_1}_S \times_S \cdots \times_S \mathbb{P}^{n_r}_S$, with line bundles $\mathcal{O}(a_1, \dots, a_r)$ of multidegree $(a_i)$.'
    why: '`NefRR`, `MoriwakiBigStatement` and `HSUse` of [the Weil bound](/proof/weil-bound/) are about subvarieties of a product of projective spaces.'
  - concept: Zariski dense
    math2: 8SQK7RTB63
    says: 'A subset of a scheme is Zariski dense if its closure in the Zariski topology is the whole space.'
    why: 'Zhang''s upper bound in [the Weil bound](/proof/weil-bound/) asks for a Zariski dense set of curves of small height.'
  - concept: Cartier divisor
    math2: FHV05ZK99F
    says: 'A Cartier divisor is a global section of $\mathcal{K}^\times/\mathcal{O}^\times$; a $\mathbb{Q}$-divisor $D$ is $\mathbb{Q}$-Cartier if some $mD$ is Cartier.'
    why: 'The point separation input of [EveryCharacter from the literature](/step/every-character-of-literature/) is written with $\mathbb{Q}$-divisors.'
  - concept: Ample
    math2: RRK8P6TXG2
    says: 'A line bundle $L$ is ample if $L^{\otimes m}$ is very ample for some $m > 0$.'
    why: '`SiegelToroidalIntegral` and `ToroidalForFanKS` in [the literature chapter](/proof/literature/) say that twists of the Hodge bundle by the boundary are ample.'
  - concept: Nef
    math2: RZ66X0NAM5
    says: 'A line bundle $L$ is nef if $(L \cdot C) \geq 0$ for each curve $C$.'
    why: '`NefRR` and `MoriwakiBigStatement` of [the Weil bound](/proof/weil-bound/) assume nefness on the generic fibre.'
  - concept: Big
    text: 'Lazarsfeld, Positivity in Algebraic Geometry I, 2.2'
    says: 'A line bundle on $X$ of dimension $n$ is big if $h^0(X, L^{\otimes m}) \geq c\,m^n$ for some $c > 0$ and all large divisible $m$; a nef $L$ is big exactly when $(L^n) > 0$.'
    why: 'The point separation input of [EveryCharacter from the literature](/step/every-character-of-literature/) uses a nef and big $N_0$.'
  - concept: Simple normal crossings
    text: 'Lazarsfeld, Positivity in Algebraic Geometry I, 4.1'
    says: 'A reduced divisor $\sum D_i$ has simple normal crossings if each $D_i$ is smooth and locally the divisor is $z_1 \cdots z_k = 0$ in coordinates.'
    why: 'Resolution, principalisation and the toroidal boundary of `ToroidalForFanKS` all produce snc divisors ([the literature chapter](/proof/literature/)).'
  - concept: klt
    text: 'Lazarsfeld, Positivity in Algebraic Geometry II, 9.3'
    says: 'A pair $(X, \Delta)$ is klt if $K_Y + \Delta_Y = \mu^*(K_X + \Delta)$ has all coefficients of $\Delta_Y$ below $1$ for a log resolution $\mu$.'
    why: 'The point separation input of [EveryCharacter from the literature](/step/every-character-of-literature/) has a klt boundary $\Delta$.'
  - concept: Multiplier ideal
    math2: BKM0TQSCD9
    says: 'For $X$ smooth and a log resolution $\mu$ of an effective $\mathbb{Q}$-divisor $D$, $\mathcal{J}(D) = \mu_*\mathcal{O}_Y(K_{Y/X} - \lfloor \mu^*D \rfloor)$.'
    why: 'It appears in `NadelVanishingAndNonKltDivisor`, a field of [the bundle of published arithmetic results](/step/published-results-arithmetic/).'
  - concept: Asymptotic Riemann-Roch
    text: 'Lazarsfeld, Positivity in Algebraic Geometry I, Corollary 1.4.41'
    says: 'For nef $L$ on projective $X$ of dimension $n$, $h^0(X, L^{\otimes m}) = (L^n) m^n/n! + O(m^{n-1})$.'
    why: 'It is the input `NefRR` of `deep_slim_use` in [the Weil bound](/proof/weil-bound/).'
  - concept: Kawamata-Viehweg vanishing
    math2: TAMCTW7SA0
    says: 'If $X$ is smooth projective of dimension $n$ over a field of characteristic $0$ and $L$ is nef with $(L^n) > 0$, then $H^i(X, \omega_X \otimes L) = 0$ for $i > 0$.'
    why: 'It is the field `KawamataViehweg` of [the bundle of published arithmetic results](/step/published-results-arithmetic/).'
    steps: [published-results-arithmetic]
  - concept: Nadel vanishing
    text: 'Lazarsfeld, Positivity in Algebraic Geometry II, Theorem 9.4.8'
    says: 'If $X$ is smooth complex projective, $D$ an effective $\mathbb{Q}$-divisor and $L - D$ nef and big, then $H^i(X, \omega_X \otimes L \otimes \mathcal{J}(D)) = 0$ for $i > 0$.'
    why: 'It is the field `NadelVanishingAndNonKltDivisor` of [the bundle of published arithmetic results](/step/published-results-arithmetic/).'
    steps: [published-results-arithmetic]
  - concept: Angehrn-Siu
    text: 'Angehrn and Siu, Effective freeness and point separation for adjoint bundles, Invent. Math. 122 (1995)'
    says: 'If $L$ is ample on a smooth projective $X$ of dimension $n$ and $(L^d \cdot Z) > (\tfrac12 n(n+1))^d$ for each $Z \ni x$ of dimension $d$, then $\omega_X \otimes L$ is generated by sections at $x$.'
    why: 'Its point separation form `PointSeparationPair` is an input of [EveryCharacter from the literature](/step/every-character-of-literature/).'
    steps: [every-character-of-literature]
  - concept: Resolution of singularities
    math2: MB52NDA6WN
    says: 'A reduced separated scheme of finite type over a field of characteristic $0$ has a smooth $X'' \to X$, a finite sequence of blow-ups that is an isomorphism over the smooth locus, with snc reduced preimage of the singular locus.'
    why: 'It is the input `ResolutionCharZero` of `deep_slim_use` in [the Weil bound](/proof/weil-bound/).'
    steps: [every-character-of-literature]
  - concept: Principalisation
    text: 'Kollár, Lectures on Resolution of Singularities, Chapter 3'
    says: 'On $X$ smooth over a field of characteristic $0$, blow-ups in smooth centres make the pullback of an ideal sheaf $I$ an effective Cartier divisor with snc support.'
    why: 'It is the input `PrincipalisationCharZero` of `deep_slim_use` in [the Weil bound](/proof/weil-bound/).'
  - concept: Dolbeault cohomology
    math2: 6GWRCGBGWC
    says: 'The Dolbeault cohomology $H^{p,q}(X)$ is $\ker\bar\partial/\operatorname{im}\bar\partial$ on smooth $(p,q)$-forms, and it is isomorphic to $H^q(X, \Omega^p_X)$.'
    why: 'The holomorphic Lefschetz formula of [the Galois row](/proof/galois-row/) computes traces on the spaces $H^{a,b}$.'
    steps: [galois-row-holds]
  - concept: Atiyah-Bott fixed-point theorem
    math2: PKS8JE1PW1
    says: 'For an elliptic complex on a compact $X$ and $f$ with $\det(1 - df_x) \neq 0$ at fixed points, $\sum (-1)^i \operatorname{tr}(T \mid H^i) = \sum_{f(x) = x} \sum_i (-1)^i \operatorname{tr}(\varphi_{i,x})/|\det(1 - df_x)|$.'
    why: 'The code proves its holomorphic form for finite étale correspondences, `HolomorphicLefschetzFormula`, which `GeoOne` takes as input ([the Galois row](/proof/galois-row/)).'
    steps: [galois-row-holds, geo-one-holds]
  - concept: Kodaira-Spencer map
    math2: EWZ1G10MAY
    says: 'For $\pi : \mathcal{X} \to B$, the map $T_tB \to H^1(X_t, \Theta_{X_t})$ is the connecting map of $0 \to \Theta_{X_t} \to \Theta_{\mathcal{X}}|_{X_t} \to \mathcal{O}_{X_t} \otimes T_tB \to 0$.'
    why: 'The proof of `GeoOne` builds the record `KSAll` of six Kodaira-Spencer statements, and `ToroidalForFanKS` makes the log Kodaira-Spencer map an isomorphism ([the Galois row](/proof/galois-row/)).'
    steps: [geo-one-holds]
  - concept: Projective bundle formula
    math2: VKMGT6271N
    says: 'For a vector bundle $E$ of rank $r$ and $\xi = c_1(\mathcal{O}(1))$, $H^*(\mathbb{P}(E))$ is free over $H^*(X)$ with basis $1, \xi, \dots, \xi^{r-1}$.'
    why: 'A projective bundle formula is one of the largest parts of the record `Steps` of `GeoOne` ([the Galois row](/proof/galois-row/)).'
    steps: [geo-one-holds]
  - concept: Finite étale
    math2: N9C4X7XKE4
    says: 'A morphism is finite étale if it is finite and étale; over $\mathbb{C}$ it is a finite covering map.'
    why: 'The correspondences $c_1, c_2 : Y \to Z$ of `HolomorphicLefschetzFormula` are finite étale ([the Galois row](/proof/galois-row/)).'
  - concept: Correspondence
    text: 'Fulton, Intersection Theory, 16.1'
    says: 'A correspondence on $X$ is a pair $c_1, c_2 : Y \to X$; with $c_1$ finite it acts on cohomology by $c_{1*} \circ c_2^*$.'
    why: 'The Hecke correspondences of Shimura varieties act on the cohomology that `GeoOne` cuts into Galois representations ([the Galois row](/proof/galois-row/)).'
  - concept: Étale cohomology
    math2: 7YX76G0838
    says: 'For $X$ of finite type over $k$ and $\ell$ prime to the characteristic, $H^i(X_{\bar k}, \mathbb{Q}_\ell) = (\varprojlim H^i_{\mathrm{et}}(X_{\bar k}, \mathbb{Z}/\ell^n)) \otimes \mathbb{Q}_\ell$, with an action of $\mathrm{Gal}(\bar k/k)$.'
    why: '`GeoOne` in [the Galois row](/proof/galois-row/) gets Galois representations from the cohomology of geometric towers.'
    steps: [geo-one-def]
  - concept: Proper base change
    math2: 1NC789DATR
    says: 'For $f : X \to S$ proper and $\mathcal{F}$ torsion, $(R^i f_*\mathcal{F})_{\bar s} \cong H^i(X_{\bar s}, \mathcal{F})$ at each geometric point $\bar s$.'
    why: 'The record `Steps` of `GeoOne` contains `UpperTheory.Et.proper_base_change` ([the Galois row](/proof/galois-row/)).'
    steps: [geo-one-holds]
  - concept: Gauss-Manin connection
    math2: 72FWSE86X4
    says: 'For $f : X \to S$ smooth proper in characteristic $0$, the Gauss-Manin connection is the integrable connection $\nabla$ on $H^i_{\mathrm{dR}}(X/S)$ with $\nabla F^p \subset F^{p-1} \otimes \Omega^1_S$.'
    why: 'It is behind the field `GaussManinPeriods` of [CM and abelian inputs](/step/cm-abelian-inputs-from-literature/).'
    steps: [cm-abelian-inputs-from-literature]
  - concept: De Rham cohomology
    math2: 13F5JZPDD0
    says: 'For $f : X \to S$ smooth, $H^i_{\mathrm{dR}}(X/S) = R^i f_*\Omega^\bullet_{X/S}$ with the Hodge filtration; for an abelian scheme $0 \to \omega_A \to H^1_{\mathrm{dR}}(A/S) \to \operatorname{Lie}(A^\vee) \to 0$.'
    why: 'It is behind the fields `AbelianDeRham` and `PeriodComparison` of [CM and abelian inputs](/step/cm-abelian-inputs-from-literature/).'
    steps: [cm-abelian-inputs-from-literature]
  - concept: Grothendieck-Messing
    math2: H8AAQJ1SZW
    says: 'Along a thickening with nilpotent divided powers, lifts of an abelian scheme correspond to lifts of its Hodge filtration in the crystal.'
    why: 'It is the input `GrothendieckDeformation` of [the literature chapter](/proof/literature/) and the field `GrothendieckMessing` of [the published arithmetic results](/step/published-results-arithmetic/).'
    steps: [cm-abelian-inputs-from-literature, published-results-arithmetic]
  - concept: Shimura variety
    math2: QT4CF7ZKK5
    says: 'For a Shimura datum $(G, X)$ and compact open $K \subset G(\mathbb{A}_f)$, $\mathrm{Sh}_K = G(\mathbb{Q})\backslash X \times G(\mathbb{A}_f)/K$.'
    why: '[The Weil bound](/proof/weil-bound/) builds a tower of integral models of unitary Shimura varieties of signature $(p, q)$.'
    steps: [covolume-bound-of-x-def]
  - concept: Toroidal compactification
    text: 'Ash, Mumford, Rapoport and Tai, Smooth Compactification of Locally Symmetric Varieties (1975)'
    says: 'A toroidal compactification of $\mathrm{Sh}_K$ is built from admissible rational polyhedral cone decompositions at the cusps, and for suitable smooth projective choices it is smooth projective with snc boundary.'
    why: '`SiegelToroidalIntegral` and `ToroidalForFanKS` are inputs of the volume branch in [the literature chapter](/proof/literature/), and `ToroidalCompactification` is a field of [the published arithmetic results](/step/published-results-arithmetic/).'
    steps: [published-results-arithmetic, every-character-of-literature]
