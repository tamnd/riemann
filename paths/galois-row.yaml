id: galois-row
title: The Galois row
for: [galois-row]
needs: [algebra, number-fields, class-field-theory, groups, representations, automorphic-forms, galois-representations, geometry, theta]
lead: 'To read the Galois row, you need polarized cuspidal representations over CM fields, their Galois representations with local Langlands and p-adic Hodge conditions, a little complex geometry, and theta lifts.'
items:
  - concept: CM field
    text: 'Washington, Introduction to Cyclotomic Fields, 2nd ed. (1997)'
    says: 'A CM field is a totally complex quadratic extension $E$ of a totally real number field $E^+$, the maximal real subfield of $E$.'
    why: '[Row0b](/step/row0b-def/) is a statement for each CM field $E$, with weights symmetric under its complex conjugation.'
    steps: [row0b-def]
  - concept: Hecke character
    math2: KPYFGB342X
    says: 'A Hecke character of a number field $K$ is a continuous homomorphism $\chi : \mathbb{A}_K^\times \to \mathbb{C}^\times$ with $\chi(K^\times) = 1$, that is a character of the idele class group $C_K$.'
    why: 'The character $\chi$ of $E^+$ in [Row0b](/step/row0b-def/) is a Hecke character, and [TLiftK](/step/tlift-k-def/) takes two more.'
    steps: [row0b-def, tlift-k-def]
  - concept: Cuspidal automorphic representation
    text: 'Borel and Jacquet, Automorphic forms and automorphic representations, Proc. Sympos. Pure Math. 33 (1979)'
    says: 'A cuspidal automorphic representation is an irreducible submodule of the space of cusp forms on $G(F) \backslash G(\mathbb{A}_F)$.'
    why: 'The input $\pi$ of [Row0b](/step/row0b-def/) is an irreducible space of cusp forms on $\mathrm{GL}_a(\mathbb{A}_E)$.'
    steps: [row0b-def]
  - concept: Regular algebraic automorphic representation
    text: 'Clozel, Motifs et formes automorphes, in Automorphic Forms, Shimura Varieties and L-functions I (1990)'
    says: 'An automorphic representation of $\mathrm{GL}_n(\mathbb{A}_E)$ is regular algebraic when its infinitesimal character at each embedding has $n$ distinct entries in $\frac{n-1}{2} + \mathbb{Z}$.'
    why: '[Row0b](/step/row0b-def/) asks that the infinitesimal character of $\pi$ be regular and algebraic (`IsRegAlg`).'
    steps: [row0b-def]
  - concept: Polarized automorphic representation
    text: 'Clozel, Harris and Taylor, Automorphy for some l-adic lifts of automorphic mod l Galois representations, Publ. IHES (2008)'
    says: 'A polarized pair $(\pi, \chi)$ has $\pi^c \cong \pi^\vee \otimes (\chi \circ N_{E/E^+})$ and $\chi_v(-1) = (-1)^n$ at each real place $v$.'
    why: '[Row0b](/step/row0b-def/) asks that $(\pi, \chi)$ be a polarized pair (`PolarizedPair`).'
    steps: [row0b-def]
  - concept: Galois representation
    math2: QW17YJ6ZCT
    says: 'Let $K$ be a field with absolute Galois group $G_K$, let $A$ be a topological commutative ring, and let $n \geq 1$. A Galois representation of $K$ of dimension $n$ over $A$ is a continuous group homomorphism $\rho: G_K \to \mathrm{GL}_n(A)$. For $A = \overline{\mathbb{Q}}_\ell$ or a finite extension of $\mathbb{Q}_\ell$, it is an $\ell$-adic Galois representation.'
    why: '[Row0b](/step/row0b-def/) gives a continuous semisimple $r : \mathrm{Gal}(\Omega/E) \to \mathrm{GL}_a(\overline{\mathbb{Q}}_\ell)$.'
    steps: [row0b-def, galois-row-holds]
  - concept: Frobenius element
    math2: H5145REFMW
    says: 'Let $L/K$ be a Galois extension of number fields, let $\mathfrak{P}$ be a prime of $L$ that is unramified over $K$, and let $q$ be the size of the residue field of the prime $\mathfrak{p} = \mathfrak{P} \cap K$. The Frobenius element of $\mathfrak{P}$ is the unique $\sigma$ in the decomposition group $D_{\mathfrak{P}}$ with $\sigma(x) \equiv x^q \pmod{\mathfrak{P}}$ for all integers $x$ of $L$. Its conjugacy class in $\operatorname{Gal}(L/K)$ depends only on $\mathfrak{p}$.'
    why: '`CoreAll` matches the eigenvalues of $r(\mathrm{Frob}_w)$ with the Satake parameters of $\pi_w$ at almost all places.'
    steps: [galois-local-global-strong-of-geometry-lift]
  - concept: Local class field theory
    math2: SHEN158T3M
    says: 'For a finite extension $K/\mathbb{Q}_p$ there is a unique local Artin map $K^\times \to \mathrm{Gal}(K^{ab}/K)$ sending uniformizers to Frobenius and with kernel $N(L^\times)$ on each finite abelian $L/K$; it induces $W_K^{ab} \cong K^\times$.'
    why: '[IsRecT](/step/is-rect-def/) asks for a local Artin map $a$ and sends a character $\chi$ of $E_w^\times$ to $\chi \circ a$.'
    steps: [is-rect-def]
  - concept: Weil-Deligne representation
    text: 'Tate, Number theoretic background, Proc. Sympos. Pure Math. 33 (1979), sec. 4'
    says: 'A Weil-Deligne representation of a local field is a representation $r$ of the Weil group with a nilpotent operator $N$ such that $r(w)Nr(w)^{-1} = |w| N$.'
    why: '[IsRecT](/step/is-rect-def/) is about maps to Weil-Deligne classes, and the clause `AwayB` of [Row0b](/step/row0b-def/) compares two of them.'
    steps: [is-rect-def, row0b-def]
  - concept: Local Langlands correspondence
    math2: 9E45NBX1G0
    says: 'For a finite extension $F$ of $\mathbb{Q}_p$, there is a unique family of bijections $\mathrm{rec}_F$ from irreducible smooth representations of $\mathrm{GL}_n(F)$ to $n$-dimensional Frobenius-semisimple Weil-Deligne representations, which is class field theory for $n = 1$ and matches L-factors and epsilon factors of pairs.'
    why: 'The laws of [IsRecT](/step/is-rect-def/) are properties of the local Langlands map, and [RecTExists](/step/rect-exists-def/) gives a map with them.'
    steps: [is-rect-def, rect-exists-def, rect-exists]
  - concept: Hodge-Tate weights
    text: 'Berger, An introduction to the theory of p-adic representations, in Geometric Aspects of Dwork Theory (2004)'
    says: 'The Hodge-Tate weights of a p-adic representation are the integers $i$ with $(V \otimes \mathbb{C}_p(i))^{G_K} \neq 0$, counted with multiplicity.'
    why: 'The fields `weights` and `weights_conj` of [Row0b](/step/row0b-def/) fix the Hodge-Tate weights of $r$ from the infinitesimal character of $\pi$.'
    steps: [row0b-def]
  - concept: Crystalline, de Rham and potentially semistable representations
    text: 'Fontaine, Representations p-adiques semi-stables, Asterisque 223 (1994)'
    says: 'A p-adic representation $V$ is crystalline, semistable or de Rham when $V$ is admissible for the period ring $B_{\mathrm{cris}}$, $B_{\mathrm{st}}$ or $B_{\mathrm{dR}}$, and potentially semistable when it is semistable over a finite extension.'
    why: 'The clause `AboveB` of [Row0b](/step/row0b-def/) asks for these conditions at places above $\ell$.'
    steps: [row0b-def]
  - concept: Local-global compatibility
    text: 'Barnet-Lamb, Gee, Geraghty and Taylor, Local-global compatibility for l = p, II, Ann. Sci. ENS 47 (2014); Caraiani, Duke Math. J. 161 (2012)'
    says: 'Local-global compatibility says that the restriction of $r_{\ell,\iota}(\pi)$ to a decomposition group at $v$ has the Weil-Deligne representation $\mathrm{rec}(\pi_v \otimes |\det|_v^{(1-n)/2})$, at $v \nmid \ell$ through Grothendieck and at $v \mid \ell$ through Fontaine.'
    why: '[Row0b](/step/row0b-def/) is a local-global compatibility statement at each finite place.'
    steps: [row0b-def, galois-local-global-strong-of-geometry-lift]
  - concept: Atiyah-Bott fixed-point theorem
    math2: PKS8JE1PW1
    says: 'For an elliptic complex on a compact $X$ and $f$ with $\det(1 - df_x) \neq 0$ at fixed points, $\sum (-1)^i \operatorname{tr}(T \mid H^i) = \sum_{f(x) = x} \sum_i (-1)^i \operatorname{tr}(\varphi_{i,x})/|\det(1 - df_x)|$.'
    why: '[GeoOne holds](/step/geo-one-holds/) through `HolomorphicLefschetzFormula`, a holomorphic Lefschetz formula for finite étale correspondences.'
    steps: [geo-one-holds]
  - concept: Dolbeault cohomology
    math2: 6GWRCGBGWC
    says: 'The Dolbeault cohomology $H^{p,q}(X)$ is $\ker\bar\partial/\operatorname{im}\bar\partial$ on smooth $(p,q)$-forms, and it is isomorphic to $H^q(X, \Omega^p_X)$.'
    why: 'The traces in `HolomorphicLefschetzFormula` are taken on the spaces $H^{a,b}$ of [GeoOne holds](/step/geo-one-holds/).'
    steps: [geo-one-holds]
  - concept: Kodaira-Spencer map
    math2: EWZ1G10MAY
    says: 'For $\pi : \mathcal{X} \to B$, the map $T_tB \to H^1(X_t, \Theta_{X_t})$ is the connecting map of $0 \to \Theta_{X_t} \to \Theta_{\mathcal{X}}|_{X_t} \to \mathcal{O}_{X_t} \otimes T_tB \to 0$.'
    why: 'The part `kodaira_spencer_of_weight_one` of [GeoOne holds](/step/geo-one-holds/) is where the Lefschetz formula enters.'
    steps: [geo-one-holds]
  - concept: Proper base change
    math2: 1NC789DATR
    says: 'For $f : X \to S$ proper and $\mathcal{F}$ torsion, $(R^i f_*\mathcal{F})_{\bar s} \cong H^i(X_{\bar s}, \mathcal{F})$ at each geometric point $\bar s$.'
    why: 'The structure `Steps` in [GeoOne holds](/step/geo-one-holds/) uses proper base change.'
    steps: [geo-one-holds]
  - concept: Skew-Hermitian form
    text: 'Scharlau, Quadratic and Hermitian Forms, 7.1'
    says: 'A skew-Hermitian form is a sesquilinear form $h$ with $h(y, x) = -\sigma(h(x, y))$.'
    why: '[TLiftK](/step/tlift-k-def/) lifts from a definite Hermitian space $X$ to a skew-Hermitian space $W$.'
    steps: [tlift-k-def]
  - concept: Theta lift
    text: 'Gelbart, Piatetski-Shapiro and Rallis, Explicit Constructions of Automorphic L-functions, LNM 1254 (1987), Part A, 2'
    says: 'The theta lift of a cusp form $f$ is $\theta(\varphi, f)(g) = \int_{[G'']} \theta(g, h; \varphi)\overline{f(h)}\, dh$, an automorphic form on $G$.'
    why: '[TLiftK](/step/tlift-k-def/) is, by its name, a theta lift from $U_n$ to $U_d$.'
    steps: [tlift-k-def, t-lift-k]
  - concept: Siegel-Weil formula
    text: 'Ichino, On the Siegel-Weil formula for unitary groups, Math. Z. 255 (2007)'
    says: 'For anisotropic $V$ of dimension $m$, the Siegel Eisenstein series of $f_\Phi$ at $s_0 = (m - n)/2$ equals $\kappa$ times the theta integral $\int_{[\mathrm{U}(V)]} \theta(g, h; \Phi)\, dh$, with $\kappa = 1$ for $m > n$ and $2$ for $m \le n$.'
    why: 'The proof [tLiftK](/step/t-lift-k/) uses `siegelWeilStd_k`, a Siegel-Weil statement by its name.'
    steps: [t-lift-k]
