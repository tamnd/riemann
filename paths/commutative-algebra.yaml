id: commutative-algebra
title: Commutative algebra, schemes and formal geometry
order: 3
needs: [algebra, geometry, number-fields]
lead: 'The commutative algebra under the schemes of the proof: flatness, completion, regular local rings and discrete valuation rings, henselian rings, coherent cohomology, Picard groups, and the passage from formal to algebraic objects by Grothendieck''s existence theorem.'
items:
  - concept: Local ring
    math2: MZ02BKPHJA
    says: 'A local ring is a ring with exactly one maximal ideal; each prime $\mathfrak p$ of a ring $A$ gives the local ring $A_{\mathfrak p}$ with residue field $k(\mathfrak p)$.'
    why: 'The stalks of the étale sheaves in [GeoOne](/step/geo-one-def/) are strictly henselian local rings.'
    steps: [geo-one-def]
  - concept: Nakayama's lemma
    math2: 15JHBYR6KH
    says: 'If $M$ is a finitely generated module over a local ring with $\mathfrak m M = M$, then $M = 0$; so lifts of a basis of $M/\mathfrak m M$ generate $M$.'
    why: 'It shows that finitely generated flat modules over noetherian local rings are free, which gives the rank of a finite étale cover.'
  - concept: Krull dimension
    math2: EX7N9D1YCD
    says: 'The Krull dimension of a ring is the supremum of the lengths of chains of prime ideals; for a noetherian local ring it is the degree of the Hilbert-Samuel polynomial.'
    why: 'The purity theorem and the freeness results on punctured spectra are statements about local rings of dimension at least $2$.'
  - concept: Krull's principal ideal theorem
    math2: SJZW2HN1SC
    says: 'In a noetherian ring a prime that is minimal over a principal ideal has height at most $1$.'
    why: 'It shows that the branch locus of a finite cover of a regular scheme, cut out by a discriminant, has pure codimension $1$.'
  - concept: Multiplicity at a prime
    math2: CZSCNZH8VY
    says: 'For a prime $W$ minimal over $I$, the multiplicity is the length of the artinian local ring $A_W/IA_W$.'
    why: 'The local orders of branches in the formal algebraization chapters are lengths of this kind.'
  - concept: Flat module
    math2: 73RYYEVDKA
    says: 'A module $M$ is flat if $- \otimes_A M$ is exact; over a principal ideal domain this means torsion free.'
    why: 'Integral models over $\mathcal{O}_v$ and completions are flat, so cohomology commutes with these base changes.'
  - concept: Faithfully flat module
    math2: C31PYYPRGC
    says: 'A flat module $M$ is faithfully flat if $N \otimes_A M = 0$ only for $N = 0$; a flat algebra is faithfully flat if and only if its spectrum maps onto $\operatorname{Spec} A$.'
    why: 'A torsor in the étale cohomology behind [GeoOne](/step/geo-one-def/) is a faithfully flat algebra, and descent along it recovers modules over the base.'
    steps: [geo-one-def]
  - concept: Free module over a local ring
    math2: 942FK83S09
    says: 'A finitely generated flat module over a noetherian local ring is free, so finitely generated flat modules over a noetherian ring are locally free of locally constant rank.'
    why: 'It makes the rank of a finite étale scheme locally constant, which the classification of its open and closed subschemes of fixed rank needs.'
  - concept: Étale algebra
    math2: FTRW0679E2
    says: 'An algebra is étale if it is flat, of finite presentation and unramified; over a field it is a finite product of finite separable extensions.'
    why: 'The étale site of [GeoOne](/step/geo-one-def/) is built from étale algebras, and Kummer covers $A[x]/(x^n - u)$ are étale when $n$ is a unit.'
    steps: [geo-one-def]
  - concept: Adic completion
    math2: KBN13NPYJQ
    says: 'The $I$-adic completion of $M$ is $\varprojlim M/I^n M$; for $A$ noetherian and $M$ finitely generated it is $M \otimes_A \widehat A$, and $\widehat A$ is flat over $A$.'
    why: 'Grothendieck''s existence theorem works over an $I$-adically complete noetherian ring, as in `FormalAlgebraisation` of [the published arithmetic results](/step/published-results-arithmetic/).'
    steps: [published-results-arithmetic]
  - concept: Artin-Rees lemma
    math2: 30H6B0G2FT
    says: 'For $A$ noetherian and $N \subseteq M$ finitely generated, $I^n M \cap N = I^{n-c}(I^c M \cap N)$ for $n \ge c$.'
    why: 'It gives the exactness of completion and the Krull intersection theorem.'
  - concept: Regular local ring
    math2: 63XXTF6B5M
    says: 'A noetherian local ring is regular if its maximal ideal is generated by $\dim A$ elements; it is then a normal unique factorization domain.'
    why: 'The record `RegularAlgebraicPurity` of [the unitary group hypotheses](/step/unitary-group-third-place-hypotheses-def/) is a purity statement over regular schemes.'
    steps: [unitary-group-third-place-hypotheses-def]
  - concept: Discrete valuation ring
    math2: MGM3CNJW9V
    says: 'A noetherian local domain of dimension $1$ is a discrete valuation ring if and only if it is integrally closed, if and only if its maximal ideal is principal.'
    why: 'Abhyankar''s lemma and the lattices that carry congruences of Galois representations in [the Galois row](/proof/galois-row/) live over discrete valuation rings.'
  - concept: Stable lattice and reduction
    text: 'Curtis and Reiner, Representation Theory of Finite Groups and Associative Algebras, (30.16)'
    says: 'A continuous representation of a compact group over a complete discretely valued field has a stable lattice, and by Brauer-Nesbitt the semisimplified reduction does not depend on the lattice.'
    why: 'It makes the residual representation of an $\ell$-adic Galois representation in [the Galois row](/proof/galois-row/) well defined.'
  - concept: Depth
    math2: M2RADBFW99
    says: 'The depth of a module over a noetherian local ring is the length of a maximal regular sequence; by Auslander-Buchsbaum it is $\operatorname{depth} A - \operatorname{pd} M$.'
    why: 'Freeness of modules on punctured spectra of regular local rings of dimension at least $3$ follows from depth and the Auslander-Buchsbaum formula.'
  - concept: Purity of the branch locus
    text: 'Grothendieck, SGA 1, Exposé X, §3'
    says: 'A finite normal cover of a regular local ring that is étale in codimension $1$ is étale.'
    why: 'It extends cyclic covers across closed sets of codimension $2$, as `RegularAlgebraicPurity` in [the unitary group hypotheses](/step/unitary-group-third-place-hypotheses-def/) records.'
    steps: [unitary-group-third-place-hypotheses-def]
  - concept: Abhyankar's lemma
    text: 'Grothendieck, SGA 1, Exposé XIII, §5'
    says: 'A tamely ramified extension of a discrete valuation ring with ramification indices dividing $n$ becomes étale after adjoining an $n$-th root of a uniformizer.'
    why: 'It removes the tame ramification of the cyclic torsors met in the étale cohomology behind [GeoOne](/step/geo-one-def/).'
    steps: [geo-one-def]
  - concept: Henselian ring
    text: 'Milne, Étale Cohomology, I, §4'
    says: 'A local ring is henselian if coprime factorizations of monic polynomials over the residue field lift; complete local rings are henselian by Hensel''s lemma.'
    why: 'Henselian rings are the local rings of the étale topology used in [GeoOne](/step/geo-one-def/).'
    steps: [geo-one-def]
  - concept: Strict henselization
    text: 'Grothendieck, EGA IV, §18.8'
    says: 'The strict henselization of a local ring is the colimit of its étale neighbourhoods with residue field embedded in a separable closure; it is strictly henselian, flat and noetherian if the ring is.'
    why: 'Stalks of étale sheaves are computed over strict henselizations, and over them finite étale covers split, which [GeoOne](/step/geo-one-def/) uses.'
    steps: [geo-one-def]
  - concept: Quasi-coherent sheaf
    math2: KPKND0K7W6
    says: 'A sheaf of modules is quasi-coherent if it is locally $\widetilde M$ for modules $M$; on an affine scheme its higher cohomology vanishes.'
    why: 'The coherent cohomology of abelian schemes and of their deformations is cohomology of such sheaves.'
  - concept: Finiteness of coherent cohomology
    math2: PQ6Q143ARJ
    says: 'For $X$ proper over a noetherian ring $A$ and $\mathcal F$ coherent, each $H^i(X, \mathcal F)$ is a finitely generated $A$-module (EGA III, Théorème 3.2.1).'
    why: 'It is the input of the comparison theorem and of the existence theorem behind `FormalAlgebraisation` in [the published arithmetic results](/step/published-results-arithmetic/).'
    steps: [published-results-arithmetic]
  - concept: Cohomology and base change
    text: 'Hartshorne, Algebraic Geometry, III.12'
    says: 'For a projective flat family, the fibre dimensions of cohomology are upper semicontinuous, and when they are constant the direct images are locally free and commute with base change.'
    why: 'It makes $R^1 f_* \mathcal{O}$ of an abelian scheme locally free, the Lie algebra of the dual abelian scheme.'
  - concept: Picard group
    math2: 3Z9DCWYXQZ
    says: 'The Picard group of a ring is the group of isomorphism classes of invertible modules under tensor product; for a scheme it is $H^1(X, \mathcal{O}_X^\times)$.'
    why: 'Through the Kummer sequence its $q$-torsion controls $H^1_{\mathrm{et}}(X, \mu_q)$ in the étale cohomology behind [GeoOne](/step/geo-one-def/).'
    steps: [geo-one-def]
  - concept: Kummer sequence
    text: 'Milne, Étale Cohomology, III, §4'
    says: 'When $q$ is invertible on $X$ there is an exact sequence $0 \to \mathcal{O}(X)^\times/q \to H^1_{\mathrm{et}}(X, \mu_q) \to \operatorname{Pic}(X)[q] \to 0$.'
    why: 'Kummer classes of units give the cyclic covers whose triviality [GeoOne](/step/geo-one-def/) needs.'
    steps: [geo-one-def]
  - concept: Relative Picard functor
    text: 'Kleiman, The Picard scheme, in FGA Explained, Chapter 9'
    says: 'For a projective flat morphism with geometrically integral fibres the relative Picard functor is represented by a separated scheme locally of finite type.'
    why: 'Its identity component for a projective abelian scheme is the dual abelian scheme of the abelian scheme chapters.'
  - concept: Theorem on formal functions
    text: 'Hartshorne, Algebraic Geometry, III.11'
    says: 'For $f$ proper and $\mathcal F$ coherent, the completion of $R^i f_* \mathcal F$ at $y$ is $\varprojlim_n H^i(X_n, \mathcal F_n)$ over the thickenings of the fibre.'
    why: 'It gives Zariski''s connectedness theorem and the full faithfulness half of the existence theorem.'
  - concept: Grothendieck's existence theorem
    text: 'Grothendieck, EGA III, Théorème 5.1.4'
    says: 'For $X$ proper over an $I$-adically complete noetherian ring, completion is an equivalence from coherent sheaves on $X$ to coherent sheaves on the formal completion.'
    why: 'It algebraizes compatible systems of closed subschemes and of polarized deformations, the content of `FormalAlgebraisation` in [the published arithmetic results](/step/published-results-arithmetic/).'
    steps: [published-results-arithmetic]
