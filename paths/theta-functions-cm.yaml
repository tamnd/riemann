id: theta-functions-cm
title: Theta functions and complex multiplication
order: 27
needs: [complex-analysis, number-fields, class-field-theory, elliptic-curves, abelian-varieties, theta]
lead: 'Theta functions with characteristics and their transformation formula, theta series of lattices, theta functions on complex tori and their algebraic theory over a base, abelian varieties with complex multiplication, the main theorem of complex multiplication and the algebraicity and integrality of CM values. The development uses these for the theta series of the theta correspondence, the key rule, and the norm bounds at CM points.'
items:
  - concept: Theta function
    math2: 2F5CYQJVAF
    says: 'The Riemann theta function $\theta(z, Z) = \sum_{n \in \mathbb{Z}^g} \exp(\pi i\, n^T Z n + 2\pi i\, n^T z)$ is holomorphic on $\mathbb{C}^g \times \mathbb{H}_g$ and is quasi-periodic for the lattice $Z\mathbb{Z}^g + \mathbb{Z}^g$.'
    why: 'The key rule of the development takes the value $1$ on the classical theta functions with half-integral characteristic.'
  - concept: Theta characteristic
    text: 'Mumford, Tata Lectures on Theta I, Chapter II'
    says: 'For $a, b \in \{0, \tfrac12\}^g$ the function $\theta[a, b](z, Z)$ is even or odd in $z$ according to the parity of $4a^Tb$, and there are $2^{g-1}(2^g + 1)$ even characteristics.'
    why: 'The normalization of the key rule and the theta functions at the prime $2$ use the half-integral characteristics.'
  - concept: Heat equation for theta
    text: 'Mumford, Tata Lectures on Theta I, Chapter II'
    says: 'The second derivatives of $\theta[m]$ in $z_j, z_k$ equal $2\pi i(1 + \delta_{jk})$ times the derivative in $Z_{jk}$.'
    why: 'The development reads Taylor coefficients (jets) of theta functions at $0$ through this equation.'
  - concept: Jacobi derivative formula
    text: 'Mumford, Tata Lectures on Theta I, Chapter I'
    says: 'For $g = 1$, $\theta_{11}''(0, \tau) = -\pi\,\theta_{00}\theta_{01}\theta_{10}(\tau) = -2\pi\,\eta(\tau)^3$.'
    why: 'It links the odd theta function to $\Delta = (2\pi)^{12}\eta^{24}$, which enters the Chowla-Selberg formula of [CM divisibility](/proof/cm-divisibility/).'
  - concept: Poisson summation formula
    math2: GARGJYSGFG
    says: 'For a Schwartz function $f$ on $\mathbb{R}^g$, $\sum_{n \in \mathbb{Z}^g} f(n) = \sum_{\xi \in \mathbb{Z}^g}\hat f(\xi)$.'
    why: 'It proves the inversion formula $\theta(Z^{-1}z, -Z^{-1}) = \det(-iZ)^{1/2}\exp(\pi i\, z^TZ^{-1}z)\theta(z, Z)$ and the modularity of theta series.'
  - concept: Symplectic group
    math2: X12FS2JAP0
    says: '$\mathrm{Sp}_{2g}(\mathbb{Z})$ acts on $\mathbb{H}_g$ by $Z \mapsto (AZ + B)(CZ + D)^{-1}$ and is generated by $J$ and the integral translations.'
    why: 'Transformation formulas of theta functions and theta series reduce to $J$ and translations.'
  - concept: Theta transformation formula
    text: 'Igusa, Theta Functions, Grundlehren 194'
    says: 'For $\gamma$ in the theta group, $\theta(((CZ+D)^T)^{-1}z, \gamma Z) = \kappa(\gamma)\det(CZ+D)^{1/2}\exp(\pi i\, z^T(CZ+D)^{-1}Cz)\,\theta(z, Z)$ with $\kappa(\gamma)^8 = 1$.'
    why: 'It makes theta constants modular forms of weight $1/2$, the weight that matches the exponents $(8, -4)$ of the key rule.'
  - concept: Modular form
    math2: GWKN5VG78A
    says: 'A Siegel modular form of weight $k$ for $\Gamma$ is a holomorphic $f$ on $\mathbb{H}_g$ with $f(\gamma Z) = \det(CZ + D)^k f(Z)$ for $\gamma \in \Gamma$.'
    why: 'Theta series of Hermitian lattices are such forms on unitary groups and span the spaces in the [theta matching chapter](/proof/theta-matching/).'
  - concept: Theta series with harmonic polynomials
    text: 'Iwaniec, Topics in Classical Automorphic Forms, chapter on theta functions'
    says: 'For an even positive definite form of rank $2k$ and level $N$ and a harmonic polynomial $P$ of degree $\nu$, $\sum_x P(x)e(Q(x)\tau)$ is a modular form of weight $k + \nu$ for $\Gamma_0(N)$ with a quadratic character, cuspidal if $\nu > 0$.'
    why: 'The theta series $\theta_P$ of the development are the Hermitian form of this construction.'
  - concept: Theta functions on a complex torus
    text: 'Birkenhake and Lange, Complex Abelian Varieties, Chapter 3'
    says: 'The functions $\theta[a/n, 0](nz, nZ)$, $a \in (\mathbb{Z}/n)^g$, form a basis of $H^0(A_Z, L^n)$, and the $n$-torsion acts on them by a finite Heisenberg group.'
    why: 'Torsion translates of theta functions, whose rationality and integrality the CM chapters need, are sections of this kind.'
  - concept: Weierstrass function and sigma function
    math2: 361NAK68QK
    says: '$\sigma(z + \omega) = \psi(\omega)\exp(\eta(\omega)(z + \omega/2))\sigma(z)$, and $\theta_L = \exp(-s_2z^2/2)\sigma$ has the canonical factor of the Riemann form $z\bar w/a(L)$.'
    why: 'The sigma log series of [CM divisibility](/proof/cm-divisibility/) is $-\log\theta_L$ with this constant $s_2$.'
  - concept: Cubical structure of a theta function
    text: 'Moret-Bailly, Pinceaux de variétés abéliennes, Astérisque 129, Chapter I'
    says: 'For a theta function $f$ with a factor $\exp(2\pi i(\ell_\lambda(v) + c_\lambda))$, the quotient $f(x+y+z)f(x)f(y)f(z)/(f(x+y)f(y+z)f(z+x))$ is periodic in each variable.'
    why: 'The cube and biadditivity relations of the sigma log series over a formal group are this identity.'
  - concept: Heisenberg group
    math2: ZZYCV5EX9J
    says: 'The theta group of an ample line bundle with $K(L) \cong K(\delta) \oplus \widehat K(\delta)$ is isomorphic to $\mathcal{H}(\delta)$, and $H^0(A, L)$ is its unique irreducible representation of weight $1$.'
    why: 'A theta structure fixes the algebraic theta functions up to one scalar, which is what the key rule normalizes.'
  - concept: Key formula
    text: 'Moret-Bailly, Pinceaux de variétés abéliennes, Astérisque 129, chapter on the key formula'
    says: 'For a symmetric rigidified principal line bundle $L$ on an abelian scheme $A/S$, $(\pi_*L)^{\otimes 8} \cong \omega_{A/S}^{\otimes -4}$, compatibly with base change.'
    why: 'The key rule of the development with its homogeneity $a^8\kappa(a\theta, Mv) = (\det M)^4\kappa(\theta, v)$ and its unit values is this formula.'
  - concept: Abelian scheme
    math2: JDDXZ89N33
    says: 'A modular form of weight $k$ and level $n \ge 3$ over $\Lambda_n$ is a rule on abelian schemes with level structure and a basis of differentials, with $f(A, M\omega) = \det(M)^{-k}f(A, \omega)$.'
    why: 'Values of such rules on abelian schemes over integral rings are integral, which turns Fourier integrality into integrality at CM points.'
  - concept: q-expansion principle
    text: 'Faltings and Chai, Degeneration of Abelian Varieties, Chapter V'
    says: 'A Siegel modular form of level $n \ge 3$ whose Fourier coefficients lie in a ring $R \supseteq \mathbb{Z}[\zeta_n, 1/n]$ is a modular form over $R$.'
    why: 'It gives the algebraicity and integrality of normalized values of theta series at CM points.'
  - concept: Complex multiplication
    math2: D3HEJTVY7G
    says: 'An abelian variety over $\mathbb{C}$ of CM type $(E, \Phi)$ is isomorphic to $\mathbb{C}^\Phi/\Phi(\mathfrak{a})$ for a lattice $\mathfrak{a} \subset E$, with a Riemann form $\operatorname{Tr}_{E/\mathbb{Q}}(\xi\bar xy)$.'
    why: 'The CM elliptic curve of [CM divisibility](/proof/cm-divisibility/) is the case $g = 1$.'
    steps: [cm-abelian-inputs-from-literature]
  - concept: Reflex field and reflex norm
    text: 'Shimura, Abelian Varieties with Complex Multiplication and Modular Functions'
    says: 'The reflex field $E^*$ is generated by the sums $\sum_{\varphi \in \Phi}\varphi(x)$, and the reflex norm $N_{\Phi^*} : E^{*\times} \to E^\times$ is the determinant over $E$ of a model of $\mathbb{C}^\Phi$ over $E^*$.'
    why: 'Galois actions on CM points and their torsion are given through the reflex norm.'
  - concept: Shimura-Taniyama formula
    text: 'Milne, Complex Multiplication, chapter on the reduction of CM abelian varieties'
    says: 'At a prime $\mathfrak{P}$ of good reduction of a CM abelian variety over $F \supseteq E^*$, the Frobenius lifts to $\pi_{\mathfrak{P}} \in \mathcal{O}_E$ with $\pi_{\mathfrak{P}}\mathcal{O}_E = N_{\Phi^*}(N_{F/E^*}\mathfrak{P})$.'
    why: 'It makes the $L$-function of a CM abelian variety a product of Hecke $L$-functions.'
  - concept: Hecke character
    math2: KPYFGB342X
    says: 'A CM elliptic curve over $F \supseteq K$ has an algebraic Hecke character $\psi$ of $F$ with $L(E/F, s) = L(s, \psi)L(s, \bar\psi)$.'
    why: 'Hecke $L$-functions of CM characters are the $L$-functions whose values the CM chapters compare with periods.'
  - concept: Main theorem of complex multiplication
    text: 'Shimura, Abelian Varieties with Complex Multiplication and Modular Functions, chapter on the main theorem'
    says: 'For $\sigma \in \mathrm{Aut}(\mathbb{C}/E^*)$ with $\sigma = \mathrm{art}_{E^*}(s)$ on $E^{*\mathrm{ab}}$, $\sigma$ carries $\mathbb{C}^\Phi/\Phi(\mathfrak{a})$ to $\mathbb{C}^\Phi/\Phi(N_{\Phi^*}(s)^{-1}\mathfrak{a})$ and acts on torsion by multiplication by $N_{\Phi^*}(s)^{-1}$.'
    why: 'The field `EllipticMainTheoremCM` of [the CM and abelian variety inputs](/step/cm-abelian-inputs-from-literature/) is the case $g = 1$.'
    steps: [cm-abelian-inputs-from-literature]
  - concept: Hilbert class field
    math2: WWCJ7CR2R3
    says: 'For $K$ imaginary quadratic, $K(j(\mathcal{O}_K))$ is the Hilbert class field of $K$.'
    why: 'The field `HilbertClassFieldJ` of [the CM and abelian variety inputs](/step/cm-abelian-inputs-from-literature/) states it.'
    steps: [cm-abelian-inputs-from-literature]
  - concept: Shimura reciprocity
    text: 'Shimura, Introduction to the Arithmetic Theory of Automorphic Functions, Theorem 6.31'
    says: 'Values of modular functions with coefficients in $\mathbb{Q}^{\mathrm{ab}}$ at CM points lie in $E^{*\mathrm{ab}}$, and the Artin symbol acts on them through an adelic element built from the reflex norm.'
    why: 'The rationality of theta translates at CM points in the development uses this law.'
  - concept: Artin reciprocity
    math2: 7938EKMMVR
    says: 'The Artin map $\mathbb{A}_{E^*}^\times/E^{*\times} \to \mathrm{Gal}(E^{*\mathrm{ab}}/E^*)$ is surjective with kernel the closure of the identity component.'
    why: 'The rationality of twisted theta series (`SeriesRatS`) in the development follows from global Artin reciprocity.'
  - concept: Algebraicity of CM values
    text: 'Shimura, Abelian Varieties with Complex Multiplication and Modular Functions, chapter on modular functions and CM points'
    says: 'For a modular form $f$ of weight $k$ with algebraic Fourier coefficients and a CM point $Z$, $\det(2\pi i M)^kf(Z)$ is algebraic, where $dz = M\omega$ for an algebraic basis $\omega$ of differentials.'
    why: 'With the Chowla-Selberg formula it puts CM values of theta series in $\overline{\mathbb{Q}}$ times a product of Gamma values, as in [CM divisibility](/proof/cm-divisibility/).'
  - concept: Algebraicity of s2
    text: 'Masser, Elliptic Functions and Transcendence, Lecture Notes in Math. 437'
    says: 'For a CM lattice $L$ with algebraic $g_2, g_3$, the number $s_2(L)$ defined by $\eta(\omega) = s_2\omega + (\pi/a(L))\bar\omega$ is algebraic.'
    why: 'It makes the Taylor coefficients of the reduced sigma function algebraic, so the sigma log series of the development has algebraic coefficients.'
  - concept: Integrality of torsion points
    text: 'Silverman, The Arithmetic of Elliptic Curves, Theorem VII.3.4'
    says: 'On an integral Weierstrass model over a discrete valuation ring of residue characteristic $p$, a torsion point whose order is not a power of $p$ has integral coordinates.'
    why: 'It gives the integrality of $\wp$ at torsion points of order prime to $\ell$ on a model with good reduction.'
  - concept: Néron model
    math2: K0EQTBRPE3
    says: 'A CM abelian variety over a number field has potentially good reduction at each finite place, so after a finite extension it extends to an abelian scheme over each local ring.'
    why: 'The field `SerreTateGoodReductionSt` of [the CM and abelian variety inputs](/step/cm-abelian-inputs-from-literature/) states it, and the integrality of CM values starts from it.'
    steps: [cm-abelian-inputs-from-literature]
