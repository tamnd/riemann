id: hermitian-lattices
title: Quadratic and hermitian lattices over number fields
order: 11
needs: [algebra, analysis, number-fields, class-field-theory, l-functions, groups]
lead: 'Lattices in quadratic and Hermitian spaces over number fields: their local classification after Jacobowitz, genera, spinor genera and class numbers, local densities, and the mass formulas of Siegel and of Gan, Hanke and Yu. The unitary branch of the proof uses the masses, the self-dual lattices and the covolumes of definite Hermitian lattices.'
items:
  - concept: Dedekind domain
    math2: 7NPY2CN5KB
    says: 'A Dedekind domain is a noetherian integrally closed domain of dimension at most one; its lattices are the finitely generated torsion-free modules that span a vector space.'
    why: 'The lattices of the unitary branch are modules over the rings of integers $\mathcal{O}_F$ and $\mathcal{O}_E$, which are Dedekind domains.'
  - concept: Steinitz class
    text: 'O''Meara, Introduction to Quadratic Forms, Chapter VIII, Quadratic Forms over Dedekind Domains'
    says: 'Every lattice is $\mathfrak{a}_1 x_1 \oplus \dots \oplus \mathfrak{a}_n x_n$ for fractional ideals $\mathfrak{a}_i$, and the class of $\mathfrak{a}_1 \cdots \mathfrak{a}_n$ in the class group determines it up to isomorphism.'
    why: 'It shows why lattices over $\mathcal{O}_E$ need not be free, so the [covolume bound](/step/covolume-bound-of-x-def/) and the masses are stated for general lattices.'
    steps: [covolume-bound-of-x-def]
  - concept: Local-global principle for lattices
    text: 'O''Meara, Introduction to Quadratic Forms, Chapter VIII, Quadratic Forms over Dedekind Domains'
    says: 'A lattice is the intersection of its localizations, and any family of local lattices that agrees with a given lattice at almost all primes comes from exactly one global lattice.'
    why: 'It makes the adelic group act on lattices, which turns classes in a genus into double cosets as in [HypsAlt](/step/hyps-alt-def/).'
    steps: [hyps-alt-def]
  - concept: Hermitian form
    math2: 8NJ7XY6F1S
    says: 'A Hermitian form on an $E$-module is linear in the first variable and satisfies $h(y, x) = c(h(x, y))$ for the involution $c$ of $E/F$.'
    why: 'The lattices of [TLiftK](/step/tlift-k-def/) carry the Hermitian form $x^T J c(y)$.'
    steps: [tlift-k-def]
  - concept: Dual lattice and self-dual lattice
    text: 'Jacobowitz, Hermitian forms over local fields, Amer. J. Math. 84 (1962)'
    says: 'The dual $L^\# = \{x : h(x, L) \subseteq \mathcal{O}_E\}$ contains every integral $L$, and $L$ is self-dual, or unimodular, when $L^\# = L$.'
    why: 'The clause `IsHerm` of [TLiftK](/step/tlift-k-def/) asks for a lattice that is its own dual.'
    steps: [tlift-k-def]
  - concept: Trace dual
    text: 'Scharlau, Quadratic and Hermitian Forms, Chapter 7'
    says: 'The dual of $L$ for the trace form $\mathrm{Tr}_{E/F}\, h$ is $\mathfrak{D}_{E/F}^{-1} L^\#$, so a self-dual Hermitian lattice is self-dual for the trace form exactly when $E/F$ is unramified at all finite places.'
    why: 'The clause `IsSkew` of [TLiftK](/step/tlift-k-def/) asks for self-duality for the trace form on the skew-Hermitian side.'
    steps: [tlift-k-def]
  - concept: Discriminant of a lattice
    text: 'O''Meara, Introduction to Quadratic Forms, Chapter VIII, Quadratic Forms over Dedekind Domains'
    says: 'The discriminant $\mathfrak{d}L$ is the ideal of $F$ generated by $N_{E/F}(\mathfrak{a}_1 \cdots \mathfrak{a}_n) \det G$, and for integral $L$ the index $|L^\#/L|$ is $N_{F/\mathbb{Q}}(\mathfrak{d}L)^2$.'
    why: 'The local factors $\lambda_v$ of the [unitary mass formula](/proof/unitary-hypotheses/) contain $|\mathfrak{d}L|_v^{-n}$.'
  - concept: Covolume of a Hermitian lattice
    text: 'Neukirch, Algebraic Number Theory, Chapter I, Section 5, Minkowski Theory'
    says: 'For positive definite $V$ the covolume of $L$ for the Euclidean structure $\mathrm{Re}\, h$ is $(2^{-d}|d_E|^{1/2})^n N_{F/\mathbb{Q}}(\mathfrak{d}L)$.'
    why: 'The bound `L3` in [CovolumeBoundOfX](/step/covolume-bound-of-x-def/) bounds the logarithm of such covolumes.'
    steps: [covolume-bound-of-x-def]
  - concept: Jordan splitting
    text: 'O''Meara, Introduction to Quadratic Forms, Chapter IX, Integral Theory of Quadratic Forms over Local Fields'
    says: 'Over a local field every lattice is an orthogonal sum of modular lattices of strictly decreasing scales, and the ranks and scales of the pieces depend only on the lattice.'
    why: 'Local densities and the factors $\lambda_v$ of the [mass formula](/proof/unitary-hypotheses/) are computed piece by piece on a Jordan splitting.'
  - concept: Jacobowitz classification
    text: 'Jacobowitz, Hermitian forms over local fields, Amer. J. Math. 84 (1962)'
    says: 'Hermitian lattices over a local field are classified by the type of a Jordan splitting, by determinant classes of the components in the ramified case, and by norm ideals in the ramified dyadic case.'
    why: 'In the unramified case it gives one unimodular lattice per space, which makes the standard lattices of `SiegelMassRatioCM` in the [unitary hypotheses](/proof/unitary-hypotheses/) well defined up to genus.'
  - concept: Hyperbolic plane
    math2: 1X5PZSK44P
    says: 'If $\mathrm{Tr}(\mathcal{O}_E) = \mathcal{O}_F$ and $L$ is unimodular, every primitive isotropic vector of $L$ lies in a unimodular hyperbolic plane that splits off $L$.'
    why: 'This gives the Iwasawa decomposition $\mathrm{U}(V) = PK$ at good places, which the [Siegel-Weil chapter](/proof/siegel-weil/) uses for the Siegel parabolic.'
  - concept: Genus and class
    text: 'Shimura, Arithmetic of unitary groups, Ann. of Math. 79 (1964)'
    says: 'The classes in the genus of $L$ are in bijection with $\mathrm{U}(V)(F) \backslash \mathrm{U}(V)(\mathbb{A}_{F,f}) / K_L$, with $K_L$ the stabilizer of $L$.'
    why: '`ClassItemsAt` in [HypsAlt](/step/hyps-alt-def/) is a statement about the classes in definite Hermitian genera.'
    steps: [hyps-alt-def]
  - concept: Spinor genus
    text: 'O''Meara, Introduction to Quadratic Forms, Chapter X, Integral Theory of Quadratic Forms over Global Fields'
    says: 'A genus of quadratic lattices is a union of a power of $2$ of proper spinor genera, and by Eichler and Kneser each spinor genus is one proper class when $\dim V \ge 3$ and $V$ is isotropic at an infinite place.'
    why: 'It explains why the [unitary hypotheses](/proof/unitary-hypotheses/) need masses only for definite spaces, where strong approximation fails.'
  - concept: Strong approximation
    text: 'Platonov and Rapinchuk, Algebraic Groups and Number Theory, Chapter 7, Strong approximation'
    says: 'For $\mathrm{SU}(V)$ noncompact at an infinite place, the determinant identifies the classes in a Hermitian genus with $E^1(F) \backslash E^1(\mathbb{A}_{F,f}) / \det K_L$.'
    why: 'The indefinite side of the construction in [HypsAlt](/step/hyps-alt-def/) has few classes, while the definite side is counted by the mass.'
    steps: [hyps-alt-def]
  - concept: Finiteness of class numbers
    text: 'Borel, Some finiteness properties of adele groups over number fields, Publ. Math. IHES 16 (1963)'
    says: 'For a linear algebraic group $G$ over a number field and a compact open $K \subset G(\mathbb{A}_{F,f})$, the set $G(F) \backslash G(\mathbb{A}_{F,f}) / K$ is finite.'
    why: '`ClassFinAt` in [HypsAlt](/step/hyps-alt-def/) is the finiteness of the class number of the definite Hermitian spaces.'
    steps: [hyps-alt-def]
  - concept: Local density
    text: 'Gan and Yu, Group schemes and local densities, Duke Math. J. 105 (2000)'
    says: 'The local density $\alpha_v(L, T)$ is the limit of the number of solutions of $X^T S c(X) \equiv T \pmod{\varpi^k}$, normalized by $q^{-k(2ma - a^2)}$.'
    why: 'The [Siegel-Weil chapter](/proof/siegel-weil/) uses local densities in `SiegelWeilUnitaryConvergent`.'
  - concept: Unimodular local densities
    text: 'Gan and Yu, Group schemes and local densities, Duke Math. J. 105 (2000)'
    says: 'For unimodular $L$ of rank $m$ and $T$ of rank $a$ at an unramified or split place, $\alpha_v(L, T) = \prod_{i=m-a+1}^m (1 - \eta_v(\varpi)^i q^{-i})$, from the order of the finite unitary group.'
    why: 'With $a = 1$ it gives the Euler factor of $L(m, \eta^m)$ in the mass ratio `SiegelMassRatioCM` of the [unitary hypotheses](/proof/unitary-hypotheses/).'
  - concept: Haar measure
    math2: CE0V9686M8
    says: 'For an invariant form $\omega$ on $\mathrm{U}(V)$ over $F_v$, the volume $|\omega|_v(\mathrm{U}(L))$ is a constant times $\alpha_v(L, L) |\mathfrak{d}L|_v^n$, with a constant that does not depend on $L$.'
    why: '`VolSigIndep` and `MassRatioUnderVolume` in [HypsAlt](/step/hyps-alt-def/) compare masses through such volumes.'
    steps: [hyps-alt-def]
  - concept: Mass of a genus
    text: 'Gan, Hanke and Yu, On an exact mass formula of Shimura, Duke Math. J. 107 (2001)'
    says: 'For a definite space the mass $\sum_i 1/|\mathrm{U}(L_i)|$ over the classes in a genus equals $\mu(G(F) \backslash G(\mathbb{A}_F)) / \mu(G(F_\infty) K_L)$ for every Haar measure $\mu$.'
    why: '`GenusMassAt D 2` in [HypsAlt](/step/hyps-alt-def/) is the mass of each positive definite Hermitian space of rank $2$.'
    steps: [hyps-alt-def]
  - concept: Siegel mass formula
    text: 'Kitaoka, Arithmetic of Quadratic Forms, Chapter 6, Quadratic forms over Z'
    says: 'The weighted average over a genus of the number of representations of $T$ is an explicit constant times $\alpha_\infty \prod_p \alpha_p$, and for $T = S$ the mass is $2/(\alpha_\infty \prod_p \alpha_p)$.'
    why: 'The [Siegel-Weil chapter](/proof/siegel-weil/) uses the analytic form of this identity for unitary groups.'
  - concept: Tamagawa number
    text: 'Weil, Adeles and Algebraic Groups'
    says: 'The Tamagawa measure is $|d_F|^{-\dim G/2} \prod_v |\omega|_v$, with $\tau(\mathrm{SO}(V)) = 2$, $\tau(\mathrm{U}(V)) = 2$ and $\tau = 1$ for simply connected groups.'
    why: 'It fixes the constant in the mass formula for the definite unitary groups of the [unitary hypotheses](/proof/unitary-hypotheses/).'
  - concept: Unitary mass formula
    text: 'Gan, Hanke and Yu, On an exact mass formula of Shimura, Duke Math. J. 107 (2001)'
    says: 'The mass of a lattice on a definite Hermitian space of rank $n$ is a constant depending on $V$ times $\prod_{i=1}^n L(i, \eta^i)$ times local factors $\lambda_v(L)$, which equal $1$ at good places.'
    why: '`SiegelMassRatioCM` in the [unitary hypotheses](/proof/unitary-hypotheses/) and the [CM divisibility chapter](/proof/cm-divisibility/) is a ratio of two such masses.'
  - concept: Siegel induction on the rank
    text: 'Braun, Zur Theorie der hermitischen Formen, Abh. Math. Sem. Hamburg 14 (1941)'
    says: 'Counting vectors $x$ with $h(x, x) = 1$ in a genus of everywhere unimodular lattices relates the masses in ranks $m$ and $m-1$, with ratio $L(m, \eta^m)$ times an archimedean factor.'
    why: 'This is the route of the development to `SiegelMassRatioCM`, used in the [unitary hypotheses](/proof/unitary-hypotheses/).'
  - concept: Dedekind zeta function
    math2: KXS5DQDFYD
    says: 'The Dedekind zeta function is $\zeta_F(s) = \prod_{\mathfrak{p}} (1 - N\mathfrak{p}^{-s})^{-1}$, and it is the factor $L(s, \eta^i)$ for even $i$ in the unitary mass formula.'
    why: 'For even $m$ the [mass ratio](/proof/unitary-hypotheses/) of ranks $m$ and $m-1$ contains the value $\zeta_F(m)$.'
