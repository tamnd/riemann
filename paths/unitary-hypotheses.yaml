id: unitary-hypotheses
title: The unitary group hypotheses
for: [unitary-hypotheses]
needs: [analysis, number-fields, class-field-theory, l-functions, groups, representations, automorphic-forms, galois-representations, theta]
lead: 'To read this chapter you need places of number fields, the local Langlands correspondence for $\mathrm{GL}_n$, cusp forms, and the names of the Howe duality, Siegel-Weil and doubling theorems.'
items:
  - concept: For all large
    math2: 0TGV80E6A4
    says: 'A statement holds for all large $x$ if it holds for each $x \ge x_0$ for some $x_0$; $f = O(g)$ means $|f| \le C g$ for all large $x$.'
    why: 'The predicate [Closed](/step/closed-def/) and most rows of [HypsAlt](/step/hyps-alt-def/) hold for all large constants or eventually in $x$.'
    steps: [closed-def, hyps-alt-def]
  - concept: Place
    math2: BT5V3TSNY6
    says: 'A place of a number field $K$ is an equivalence class of nontrivial absolute values on $K$. The finite places are the nonzero primes of $\mathcal{O}_K$, and the infinite places are the real embeddings and the pairs of complex embeddings.'
    why: '[RecTExists](/step/rect-exists-def/) asks for a map at each finite place $w$ of each number field $E$.'
    steps: [rect-exists-def]
  - concept: Valuation ring
    math2: QSX12D8RQM
    says: 'A valuation ring of a field $\Omega$ is a subring $A$ with $x \in A$ or $x^{-1} \in A$ for each $x \in \Omega^\times$. It lies over the finite place $\mathfrak p$ of $K$ if $A \cap K = (\mathcal{O}_K)_{\mathfrak p}$.'
    why: '[RecTExists](/step/rect-exists-def/) fixes a valuation subring $A$ of an algebraic closure of $E$ that lies over $w$.'
    steps: [rect-exists-def]
  - concept: Ramification
    math2: E7WHZXQ0WF
    says: 'If $\mathfrak p\mathcal{O}_L = \mathfrak P_1^{e_1} \cdots \mathfrak P_g^{e_g}$, then $e_i$ is the ramification index of $\mathfrak P_i$, and $\mathfrak p$ is ramified in $L$ when some $e_i > 1$. It splits completely if $g = [L:K]$ and is inert if $\mathfrak p\mathcal{O}_L$ is prime.'
    why: 'The bound `LinkN` of the field `nRest` of [HypsAlt](/step/hyps-alt-def/) weights each twisted place $w$ by its ramification index $e_w$.'
    steps: [hyps-alt-def]
  - concept: Local class field theory
    math2: SHEN158T3M
    says: 'For a finite extension $K/\mathbb{Q}_p$ there is a unique local Artin map $K^\times \to \mathrm{Gal}(K^{ab}/K)$ sending uniformizers to Frobenius and with kernel $N(L^\times)$ on each finite abelian $L/K$; it induces $W_K^{ab} \cong K^\times$.'
    why: 'One law of [IsRecT](/step/is-rect-def/) asks that the map agrees with local class field theory for $n = 1$.'
    steps: [is-rect-def, rect-exists-def]
  - concept: Artin reciprocity
    math2: 7938EKMMVR
    says: 'For a finite abelian $L/K$ and a modulus $\mathfrak m$ divisible by the ramified places, the Artin map $I_K^{\mathfrak m} \to \mathrm{Gal}(L/K)$, $\mathfrak p \mapsto \mathrm{Frob}_{\mathfrak p}$, is surjective with kernel $P_K^{\mathfrak m} N_{L/K}(I_L^{\mathfrak m})$ when $\mathfrak m$ is large enough.'
    why: 'In branch 1 of [nonempty-hyps](/step/nonempty-hyps/), the part `hServ_of_linkR` proves the service row from global Artin reciprocity.'
    steps: [nonempty-hyps]
  - concept: Class number formula
    math2: 55XX5A7XZV
    says: '$\operatorname{Res}_{s=1} \zeta_K(s) = 2^{r_1}(2\pi)^{r_2} h_K R_K/(w_K \sqrt{|d_K|})$; for an imaginary quadratic field of discriminant $-d$ with $d > 4$, $L(1, \chi_{-d}) = \pi h/\sqrt d$.'
    why: 'The record [HypsAlt](/step/hyps-alt-def/) has a field `StandardLattice.ClassNumberFormula₂`, a class number formula at the datum.'
    steps: [hyps-alt-def]
  - concept: Strong approximation
    text: 'Platonov and Rapinchuk, Algebraic Groups and Number Theory, 7.4'
    says: 'For $G$ simply connected and absolutely almost simple over $F$ and $S$ a finite set of places with $\prod_{v \in S} G(F_v)$ not compact, $G(F)$ is dense in $G(\mathbb{A}_F^S)$.'
    why: 'The multiplicity row of branch 3 in [nonempty-hyps](/step/nonempty-hyps/) takes strong approximation as one of its fourteen named hypotheses.'
    steps: [nonempty-hyps]
  - concept: Bernstein-Zelevinsky finiteness
    text: 'Bernstein and Zelevinsky, Induced representations of reductive p-adic groups I, Ann. Sci. ENS 10 (1977)'
    says: 'Parabolic induction and Jacquet modules preserve finite length, and $\dim \pi^J$ is bounded by a constant $c(J)$ over all smooth irreducible $\pi$.'
    why: 'Branch 2 of [nonempty-hyps](/step/nonempty-hyps/) proves `LambdaLowerBound₂` from seven hypotheses, one of them Bernstein-Zelevinsky finiteness.'
    steps: [nonempty-hyps]
  - concept: Formal degree
    text: 'Harish-Chandra, Discrete series for semisimple Lie groups II, Acta Math. 116 (1966)'
    says: 'The formal degree $d(\pi)$ of a discrete series is the constant with $\int_G |\langle \pi(g)u, v \rangle|^2 dg = d(\pi)^{-1}\|u\|^2\|v\|^2$; for real groups it is the Weyl dimension of the compact dual, up to the Haar measure.'
    why: 'The same seven hypotheses of branch 2 in [nonempty-hyps](/step/nonempty-hyps/) include one on formal degrees.'
    steps: [nonempty-hyps]
  - concept: Cusp form
    math2: A50Y012RBP
    says: 'A cusp form is a modular form that tends to $0$ at each cusp; on an adelic group it is an automorphic form whose constant terms along all proper parabolics vanish.'
    why: 'Several fields of [UnitaryGroupThirdPlaceHypotheses](/step/unitary-group-third-place-hypotheses-def/) are statements on cusp forms of unitary groups.'
    steps: [unitary-group-third-place-hypotheses-def]
  - concept: Rapid decay of cusp forms
    text: 'Moeglin and Waldspurger, Spectral Decomposition and Eisenstein Series, I.2.18'
    says: 'A cusp form $\varphi$ satisfies $|\varphi(g)| \le C_r\|g\|^{-r}$ on a Siegel set for each $r > 0$.'
    why: 'The field `cuspRapidDecay` is the one hypothesis that the chapter unfolds, and branches 2 and 3 of [nonempty-hyps](/step/nonempty-hyps/) use it.'
    steps: [unitary-group-third-place-hypotheses-def, nonempty-hyps]
  - concept: Weil group
    math2: TH24PGYAM5
    says: 'Let $F$ be a nonarchimedean local field with residue field of size $q$, and let $I_F$ be the inertia subgroup of $G_F = \operatorname{Gal}(\overline{F}/F)$. The Weil group $W_F$ is the subgroup of elements of $G_F$ that act on the algebraic closure of the residue field as $x \mapsto x^{q^n}$ for some integer $n$. Its topology makes $I_F$ an open subgroup with its profinite topology.'
    why: 'The values of the map of [RecTExists](/step/rect-exists-def/) are Weil-Deligne representations, so representations of the Weil group with a monodromy operator.'
    steps: [rect-exists-def]
  - concept: Weil-Deligne representation
    text: 'Tate, Number theoretic background, Proc. Sympos. Pure Math. 33 (1979), sec. 4'
    says: 'A Weil-Deligne representation of a local field is a representation $r$ of the Weil group with a nilpotent operator $N$ such that $r(w)Nr(w)^{-1} = |w| N$.'
    why: '[RecTExists](/step/rect-exists-def/) sends each irreducible representation of $\mathrm{GL}_n(E_w)$ to a Weil-Deligne representation.'
    steps: [rect-exists-def]
  - concept: Local Langlands correspondence
    math2: 9E45NBX1G0
    says: 'For a finite extension $F$ of $\mathbb{Q}_p$, there is a unique family of bijections $\mathrm{rec}_F$ from irreducible smooth representations of $\mathrm{GL}_n(F)$ to $n$-dimensional Frobenius-semisimple Weil-Deligne representations, which is class field theory for $n = 1$ and matches L-factors and epsilon factors of pairs.'
    why: 'The input $h_L$ of [nonempty-hyps](/step/nonempty-hyps/) is [RecTExists](/step/rect-exists-def/), the existence half of a local Langlands correspondence for $\mathrm{GL}_n$.'
    steps: [nonempty-hyps, rect-exists-def]
  - concept: Howe duality
    text: 'Gan and Takeda, A proof of the Howe duality conjecture, J. Amer. Math. Soc. 29 (2016)'
    says: 'If $\Theta(\pi) \ne 0$ then it has a unique irreducible quotient $\theta(\pi)$, and $\theta(\pi_1) \cong \theta(\pi_2) \ne 0$ implies $\pi_1 \cong \pi_2$.'
    why: 'The top node of [nonempty-hyps](/step/nonempty-hyps/) gets `FunctionalsSeparate` from `howeUnram_holds`, and its proof of `twisted_local_factors_match` uses the field `howeDualityReal`.'
    steps: [nonempty-hyps]
  - concept: Siegel-Weil formula
    text: 'Ichino, On the Siegel-Weil formula for unitary groups, Math. Z. 255 (2007)'
    says: 'For anisotropic $V$ of dimension $m$, the Siegel Eisenstein series of $f_\Phi$ at $s_0 = (m - n)/2$ equals $\kappa$ times the theta integral $\int_{[\mathrm{U}(V)]} \theta(g, h; \Phi)\, dh$, with $\kappa = 1$ for $m > n$ and $2$ for $m \le n$.'
    why: 'The top node of [nonempty-hyps](/step/nonempty-hyps/) uses the field `siegelWeilUnitaryConvergent`, and each branch has a hypothesis named after the Siegel-Weil formula.'
    steps: [nonempty-hyps]
  - concept: Doubling method
    text: 'Gelbart, Piatetski-Shapiro and Rallis, Explicit Constructions of Automorphic L-functions, LNM 1254 (1987), Part A'
    says: 'The doubling method integrates a Siegel Eisenstein series on $\mathrm{U}(W^\square)$ against $\varphi_1 \otimes \bar\varphi_2$ on $\mathrm{U}(W) \times \mathrm{U}(W)$ and unfolds it to $\int f_s(\delta\iota(g, 1))\langle\pi(g)\varphi_1, \varphi_2\rangle\, dg$.'
    why: 'The field `doublingMethod` is one of the seven hypotheses of `LambdaLowerBound₂` in branch 2 of [nonempty-hyps](/step/nonempty-hyps/).'
    steps: [nonempty-hyps, unitary-group-third-place-hypotheses-def]
