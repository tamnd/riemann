summaries:
  07EZA80NEH: 'The signature of a real [[quadratic form|0RBQS1JJCR]] records the numbers of positive, negative and zero coefficients in any diagonal form of it.'
  0ADTQBXRMC: 'The Jacobi symbol $\left(\frac{a}{n}\right)$ extends the Legendre symbol to each odd positive integer $n$, as a product over the prime factors of $n$.'
  0CBAB9QQ9X: 'The complex numbers can be constructed as ordered pairs of [[real numbers|08J2M1JYAG]].'
  0M3YQJ81NB: 'Let $U \subseteq V$ be open subsets of $\mathbb{C}$, with $U$ nonempty and $V$ a [[domain|097KNJFJ7V]], and let $f$ be [[holomorphic|0DG0Z72CQD]] on $U$. An analytic continuation of $f$ to $V$ is a function $F$ that is holomorphic on $V$ with $F(z) = f(z)$ for each $z \in U$.'
  0NK8JTE1NN: 'The von Mangoldt function $\Lambda$ takes the value $\log p$ at each power of a prime $p$, and $0$ at all other positive integers.'
  2F5CYQJVAF: 'The Jacobi theta function is $\vartheta(z, \tau) = \sum_{n \in \mathbb{Z}} e^{\pi i n^2 \tau + 2 \pi i n z}$ for $z \in \mathbb{C}$ and $\tau$ in the [[upper half-plane|X6XGGH5FPW]].'
  2MKHH636C3: 'A Harish-Chandra module is the algebraic shadow of a representation of a real reductive group $G$.'
  2XS84PWE3S: 'A reductive group is a connected [[linear algebraic group|GA81VVQHEP]] with no nontrivial connected normal unipotent subgroup.'
  36YNSTESMQ: 'The Selmer group of an isogeny of [[elliptic curves|427N6S6QQW]] over a [[number field|MWBDFS2KJ5]] is a group of [[Galois cohomology|9MPCZ3EAJM]] classes.'
  48P4A1CX85: 'Let $V$ be a vector space over $\mathbb{C}$. A Hermitian form on $V$ is a [[sesquilinear form|054YEQ0Y8M]] $h$, linear in the first slot and conjugate-linear in the second, with $h(v, u) = \overline{h(u, v)}$ for all $u, v \in V$.'
  4CSMQFTGD8: 'Fix a prime $\ell$. The $\ell$-adic Tate module of an abelian group collects its elements of $\ell$-power order into one module over the [[$\ell$-adic integers|V6TJAFZ4MD]].'
  5J2P2AGY4N: 'The name Hecke algebra covers several related algebras; the most common is the Iwahori–Hecke algebra of a [[Coxeter group|G6FND7X69J]].'
  6YDZNXR19H: 'This topic is a part of [[arithmetic geometry|73BKSN9KXY]].'
  74BPYJNZTM: 'A unitary representation of a [[topological group|92700QAB5Y]] $G$ is a homomorphism from $G$ to the [[unitary operators|MM0EJ2GDE4]] on a [[Hilbert space|HM2HHE3J51]].'
  7NPY2CN5KB: 'A Dedekind domain is an integral domain in which every nonzero proper ideal is, in a unique way, a product of prime ideals.'
  7X92G8CQ33: 'Let $L/K$ be a Galois extension of number fields, and let $\mathfrak{P}$ be a prime of $L$. The decomposition group of $\mathfrak{P}$ is the subgroup of the [[Galois group|0XTY86BZKY]] that maps $\mathfrak{P}$ to itself.'
  9AZ164C298: 'In number theory, **cuspidal representations** are certain representations of algebraic groups that occur discretely in $L^2$ spaces. The term *cuspidal* is derived, at a certain distance, from the cusp forms of classical modular form theory. In the contemporary formulation of automorphic representations, representations take the place of [[holomorphic functions|0DG0Z72CQD]]; these representations may be of adelic algebraic groups.'
  9GHD9MXNYV: 'The idele class group of a [[number field|MWBDFS2KJ5]] $K$ is the quotient $C_K = I_K / K^\times$ of the idele group $I_K$ by the nonzero elements of $K$.'
  9MPCZ3EAJM: 'Galois cohomology is the [[group cohomology|YXJXA0Q52R]] of Galois groups, see the [[definition|EESNTXFWHZ]].'
  A50Y012RBP: 'A cusp form is a [[modular form|GWKN5VG78A]] that vanishes at every cusp.'
  BK9WBMF56G: 'Let $E$ be an [[elliptic curve|427N6S6QQW]] over a [[number field|MWBDFS2KJ5]] $K$. Its Tate–Shafarevich group $\text{Ш}(E/K)$ measures the failure of the [[Hasse principle|EMAR4X3W8D]] for twisted forms of $E$.'
  BT5V3TSNY6: 'A place of an [[algebraic number field|MWBDFS2KJ5]] $K$ is a class of equivalent nontrivial absolute values on $K$.'
  BT6T702C28: 'For a [[prime number|01826KMG2H]] $p$, the $p$-adic numbers form the field $\mathbb{Q}_p$, the completion of $\mathbb{Q}$ for the [[p-adic absolute value|WGN82TCEF2]].'
  CD20HVR9V8: 'The Weil representation is a unitary representation of the [[metaplectic group|8B0JM2YDE2]], a two-fold cover of the [[symplectic group|X12FS2JAP0]] over a local field.'
  CG9JEATW3Q: 'The Schwartz space $\mathcal{S}(\mathbb{R}^n)$ is the space of smooth functions on $\mathbb{R}^n$ that, together with all their derivatives, decay faster than any power of $1/\left|x\right|$.'
  CZSCNZH8VY: 'The length of a module is the largest number of strict steps in a chain of its submodules.'
  EQ6A3ZN48K: 'A Gauss sum is a finite sum $\sum_a \chi(a)\psi(a)$ over a [[finite field|0ZXZ82FTX2]], where $\chi$ is a multiplicative character and $\psi$ an additive character.'
  EWZ1G10MAY: 'The Kodaira–Spencer map of a [[deformation|VKQSM3BCE4]] measures how fast the complex structure of the fibre changes.'
  F1FF505PWH: 'A height function measures the arithmetic complexity of a rational or algebraic point, roughly the number of digits needed to write down its coordinates.'
  FX3NEFYFFN: 'An irreducible representation is a nonzero [[group representation|WYGRXCG2RN]] with no proper nonzero [[invariant subspace|0ACX5QT8TE]].'
  GWKN5VG78A: 'A modular form of weight $k$ is a [[holomorphic function|0NAHXR1FRH]] on the [[upper half-plane|X6XGGH5FPW]].'
  H5145REFMW: 'Let $L/K$ be a Galois extension of number fields, and let $\mathfrak{P}$ be a prime of $L$ that is unramified over $K$. Let $q$ be the size of the residue field of the prime of $K$ below $\mathfrak{P}$. The Frobenius element of $\mathfrak{P}$ is the unique element of the [[decomposition group|7X92G8CQ33]] that acts on the residue field as the [[Frobenius automorphism|0CGCPX8Z70]] $x \mapsto x^q$.'
  J85FZEQG38: 'A local field is a field with a nontrivial absolute value for which it is locally compact.'
  JJP4JFH3C6: 'Induction builds a [[representation|WYGRXCG2RN]] of a group $G$ from a representation of a [[subgroup|0X1JXT47GA]] $H$.'
  K6HW8YWCQJ: 'In mathematics, **Fontaine''s period rings** are a collection of [[commutative rings|0310REJJY8]] first defined by Jean-Marc Fontaine that are used to classify $p$-adic Galois representations.'
  KA0YDB6QXE: 'A profinite group is a [[topological group|92700QAB5Y]] that is an [[inverse limit|DZB378CNCK]] of finite groups.'
  KNJA2NEZ9F: 'A fundamental domain for a [[group action|0WCY42EV9V]] on a space is a subset that contains one point of each [[orbit|0YQPZB5Q1G]].'
  MWBDFS2KJ5: 'An algebraic number field, or number field, is a [[field extension|0EQWVHF3W5]] of the rational numbers of finite degree.'
  NN77VYSGXR: 'The $n$-th cyclotomic field is the field $\mathbb{Q}(\zeta_n)$ obtained by adjoining to $\mathbb{Q}$ a [[primitive $n$-th root of unity|0EHM5ZP5QH]] $\zeta_n$.'
  PGKWBJDTKX: 'The absolute Galois group of a field $K$ is the Galois group of a [[separable closure|JJ91A1V8NQ]] of $K$ over $K$.'
  PQ7JJY0VPH: 'Let $F$ be a field. A symplectic vector space is a finite-dimensional vector space $V$ over $F$ with a symplectic form: an [[alternating bilinear form|0DGDS5XY84]] $\omega$ that is [[nondegenerate|01NHFZF2SK]].'
  QYW79XKJTP: 'Tate''s thesis is the 1950 doctoral thesis of John Tate, written under Emil Artin.'
  S4SV3QZ8B1: 'The Hecke operators $T_n$, for $n \ge 1$, are linear maps on the space $M_k$ of [[modular forms|GWKN5VG78A]] of weight $k$.'
  SHEN158T3M: 'Local class field theory describes the abelian extensions of a non-Archimedean [[local field|J85FZEQG38]] $K$ in terms of the multiplicative group $K^\times$.'
  TH24PGYAM5: 'In mathematics, a **Weil group**, introduced by André Weil, is a modification of the absolute Galois group of a local or global field, used in class field theory. For such a field $F$, its Weil group is generally denoted $W_F$. There also exists "finite level" modifications of the Galois groups: if $E/F$ is a finite extension, then the **relative Weil group** of $E/F$ is $W_{E/F}=W_F/W_E^c$ (where the superscript $c$ denotes the [[commutator subgroup|08SJ5K2CBG]]).'
  VQ8XNV47K9: 'This topic is a part of [[automorphic forms and the Langlands program|WWQWPSF9Q4]].'
  VY0HXD3GC4: 'A Haar measure on a [[locally compact group|AHV05ZBCYW]] is a nonzero [[Radon measure|HZNEQQBCW4]] that does not change under left translation by elements of the group.'
  WYGRXCG2RN: 'A representation of a [[group|G5S1M9]] $G$ on a [[vector space|000AYPA9AJ]] $V$ is a [[group homomorphism|0JYTG5K9Y4]] $G \to GL(V)$.'
  XSGB5K2KEG: 'In number theory, a **cyclotomic character** is a character of a [[Galois group|0XTY86BZKY]] giving the Galois action on a group of roots of unity. As a one-dimensional representation over a [[ring|0B1261B5ED]] $R$, its representation space is generally denoted by $R(1)$ (that is, it is a representation $\chi : G \to \operatorname{Aut}_{R}(R(1)) \approx \operatorname{GL}(1, R)$).'
  Y2SPPSQ5D4: 'Iwasawa theory studies arithmetic objects, such as [[ideal class groups|WQ46BD3ARY]], along an infinite tower of number fields $K = K_0 \subset K_1 \subset K_2 \subset \cdots$.'
  ZBGT50BW0Z: 'The theta correspondence, or Howe correspondence, matches irreducible representations of the two members of a reductive dual pair inside a symplectic group.'
  ZH21D5B62C: 'Deligne–Lusztig theory constructs representations of finite [[groups of Lie type|NPEBABQ49M]], such as $GL_n(\mathbb{F}_q)$, from the $\ell$-adic cohomology of certain algebraic varieties.'
