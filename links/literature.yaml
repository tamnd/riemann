- name: UpperTheory.LiteratureTheorems.resolution_char_zero_of_literature
  statement: GlobalTheory.CompanionTheory.Hypotheses₂.ResolutionCharZero
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 557
  result: Hironaka's resolution of singularities in characteristic zero
  says: 'Let $X$ be a reduced scheme of finite type, quasi-compact and separated over a field of characteristic zero. Then a finite sequence of blow-ups gives a smooth $X'' \to X$. This map is an isomorphism over the smooth locus of $X$, and the reduced preimage of the singular locus is a simple normal crossings divisor.'
