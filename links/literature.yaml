  result: Galois representations attached to regular algebraic polarised cuspidal automorphic representations of GL(n) over CM fields, with local-global compatibility
  says: 'For each regular algebraic cuspidal automorphic representation $\pi$ of $\mathrm{GL}_a$ over a CM field that is part of a polarised pair, and each prime $\ell$, there is a continuous semisimple $\ell$-adic Galois representation. It has the expected Hodge-Tate weights, and they are symmetric under complex conjugation. Away from $\ell$ it is compatible with the local Langlands map $rc$, and at places above $\ell$ it has the expected $p$-adic Hodge theoretic behaviour.'
  cite:
    - authors: [Gaëtan Chenevier, Michael Harris]
      title: Construction of automorphic Galois representations, II
      venue: Camb. J. Math. 1
      year: 2013
      doi: 10.4310/CJM.2013.v1.n1.a2
      verified: true
    - authors: [Sug Woo Shin]
      title: Galois representations arising from some compact Shimura varieties
      venue: Ann. of Math. 173
      year: 2011
      doi: 10.4007/annals.2011.173.3.9
      verified: true
    - authors: [Ana Caraiani]
      title: Local-global compatibility and the action of monodromy on nearby cycles
      venue: Duke Math. J. 161
      year: 2012
      doi: 10.1215/00127094-1723706
      verified: true
    - authors: [Thomas Barnet-Lamb, Toby Gee, David Geraghty, Richard Taylor]
      title: Local-global compatibility for l = p, II
      venue: Ann. Sci. Éc. Norm. Supér. (4) 47
      year: 2014
      doi: 10.24033/asens.2212
      verified: true
  math2: ZCQ7KAV3A0
  note: 'This is a hypothesis structure, not a theorem. On the trunk, `vwin_of_row` builds it as `OpenImageCondition.mk h`, where `h` is the hypothesis `Row0b`, and the Lean code proves `Row0b` with `galoisLocalGlobalStrong_recParameter`. So the proof on the trunk does not assume it. The name is misleading, because the field states the existence of Galois representations, not an open image condition. The compatibility is stated for the map $rc$ given by `IsRecT`, so it depends on the Lean local Langlands statement. The ''$\ell = p$, I'' paper of the same authors was not checked.'

- name: GlobalTheory.Hk3.howeUnram_holds
  statement: GlobalTheory.Hk3.HoweUnram
  file: Development/AbelianVarietyTheory/Proofs/SatakeParameters/RhoMemOfMkEq.lean
  line: 250
  result: Unramified Howe duality (the spherical vector generates the invariants)
  says: 'Take an unramified local unitary dual pair over a $p$-adic field of characteristic zero, with a Weil representation $M$ and a nonzero vacuum vector $s$ that is cyclic. Then every vector fixed by the integral points of the first group lies in the span of the second group''s orbit of $s$. The same holds with the two groups exchanged.'
  reads_hypothesis: false
