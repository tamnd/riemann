# The named results: the places where the written proof cites a published result in place of a step.
# rh check reads this file (rule L1). Each Lean name here is a theorem or a structure of the Lean code. The Lean code proves each theorem. The citation tells where the same mathematics is published, and the note tells how the Lean statement differs from it.

- name: UpperTheory.LiteratureTheorems.ar_degree_of_literature
  statement: GlobalTheory.Published.ArDegree
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 251
  result: Birational invariance of arithmetic self-intersection, and the Chern-Weil degree formula
  says: '`ArDegree` is the conjunction of `ArBirational` and `ChernDegree`. `ArBirational` says that the arithmetic self-intersection number of a hermitian line bundle does not change under pullback by a birational morphism of generically smooth arithmetic varieties. `ChernDegree` says that for a smooth metric on a line bundle given by a divisor, the integral of the top power of its Chern form equals the degree of the divisor.'
  reads_hypothesis: false
  cite:
    - authors: [Henri Gillet, Christophe Soulé]
      title: Arithmetic intersection theory
      venue: Publ. Math. IHÉS 72
      year: 1990
      doi: 10.1007/BF02699132
      verified: true
    - authors: [Phillip Griffiths, Joseph Harris]
      title: Principles of Algebraic Geometry
      venue: Wiley
      year: 1978
      doi: 10.1002/9781118032527
      verified: true
  note: 'This is two standard facts in one statement, not one named theorem. The first part is a case of the projection formula of Gillet-Soulé. The proof does not use `O`. It uses the in-repository Poincaré-Lelong result and resolution.'

- name: UpperTheory.LiteratureTheorems.fargues_exact_of_literature
  statement: GlobalTheory.CompanionTheory.Ar.HT.FarguesExact
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 549
  result: Exactness of the Hodge-Tate sequence for p-divisible groups over the ring of integers of an algebraically closed p-adic field (Fargues)
  says: 'Let $G$ be a $p$-divisible group over the ring of integers $\mathcal{O}$ of a complete algebraically closed field $C$ of characteristic zero. Let $B$ be the $\mathcal{O}$-linear extension of the Weil pairing between the Tate modules of $G$ and its dual. Then an element $x$ of $\mathcal{O} \otimes T_p G$ is in the kernel of the Hodge-Tate map if and only if $B(x, y) = 0$ for all $y$ in the kernel of the $\operatorname{dlog}$ map of the dual.'
  reads_hypothesis: false
  cite:
    - authors: [Laurent Fargues]
      title: "L'isomorphisme entre les tours de Lubin-Tate et de Drinfeld au niveau des points"
      venue: "in: L'isomorphisme entre les tours de Lubin-Tate et de Drinfeld, Progr. Math. 262, Birkhäuser"
      year: 2008
      doi: 10.1007/978-3-7643-8456-2_3
      verified: true
    - authors: [Peter Scholze, Jared Weinstein]
      title: Moduli of p-divisible groups
      venue: Camb. J. Math. 1
      year: 2013
      doi: 10.4310/CJM.2013.v1.n2.a1
      verified: true
    - authors: [John Tate]
      title: p-divisible groups
      venue: Proceedings of a Conference on Local Fields (Driebergen 1966), Springer
      year: 1967
      doi: 10.1007/978-3-642-87942-5_12
      verified: true
  math2: 6YDZNXR19H
  note: 'The Lean form is an orthogonality statement about kernels. It is not the exact sequence itself. Over $\mathcal{O}_C$ the integral Hodge-Tate sequence is exact only up to torsion killed by $p^{1/(p-1)}$. Check that the integral if-and-only-if in Lean is true as stated. The exact section of Fargues'' chapter was not checked. The proof is a direct term and does not use `O`.'

- name: UpperTheory.LiteratureTheorems.grothendieck_deformation_of_literature
  statement: GlobalTheory.Published.GrothendieckDeformation
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 405
  result: Grothendieck-Messing deformation theory of abelian schemes
  says: 'Let $R \to R_0$ be a surjection of rings whose kernel $I$ has nilpotent divided powers. For abelian schemes over $R_0$ with a lift to $R$, the crystal gives a canonical identification with de Rham cohomology. Lifts of an abelian scheme correspond to admissible lifts of its Hodge filtration. A homomorphism lifts, and lifts uniquely, when it respects the lifted filtrations.'
  reads_hypothesis: false
  cite:
    - authors: [William Messing]
      title: "The Crystals Associated to Barsotti-Tate Groups: with Applications to Abelian Schemes"
      venue: Lecture Notes in Math. 264, Springer
      year: 1972
      doi: 10.1007/BFb0058301
      verified: true
    - authors: [Barry Mazur, William Messing]
      title: Universal Extensions and One Dimensional Crystalline Cohomology
      venue: Lecture Notes in Math. 370, Springer
      year: 1974
      doi: 10.1007/BFb0061628
      verified: true
  math2: H8AAQJ1SZW
  note: 'The proof passes `O` to `abelian_de_rham_of_literature` and `abelian_lifting_of_literature`. Both ignore `O`, so `O` is used in name only. The Lean form has no hypothesis that $p$ is nilpotent in $R$. The derived `GrothendieckMessing` has that hypothesis. So the Lean form is the general form for abelian schemes, as in Mazur-Messing. It is not Messing''s $p$-nilpotent setting. Check that the published results cover this generality.'

- name: UpperTheory.LiteratureTheorems.local_langlands_gl_recT_exists_of_literature
  statement: UpperTheory.Zero.LLC.RecTExists
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 313
  result: Local Langlands correspondence for GL(n) over p-adic fields (Harris-Taylor, Henniart)
  says: 'At each finite place $w$ of a number field there is a map $rc$ from irreducible admissible representations of $\mathrm{GL}_n(E_w)$ to Weil-Deligne representations. The map keeps dimension. It agrees with local class field theory for $n = 1$ and is compatible with Langlands classification by segments. It sends cuspidals to irreducibles, respects twists, central characters and contragredients, and is injective on a class of good representations. It sends depth-zero representations to tame ones and follows a law for depth-zero types.'
  reads_hypothesis: true
  cite:
    - authors: [Michael Harris, Richard Taylor]
      title: The Geometry and Cohomology of Some Simple Shimura Varieties
      venue: Ann. of Math. Stud. 151, Princeton Univ. Press
      year: 2001
      doi: 10.1515/9781400837205
      verified: true
    - authors: [Guy Henniart]
      title: Une preuve simple des conjectures de Langlands pour GL(n) sur un corps p-adique
      venue: Invent. Math. 139
      year: 2000
      doi: 10.1007/s002220050012
      verified: true
    - authors: [Peter Scholze]
      title: The local Langlands correspondence for GL_n over p-adic fields
      venue: Invent. Math. 192
      year: 2013
      doi: 10.1007/s00222-012-0420-5
      verified: true
  math2: 9E45NBX1G0
  note: 'The proof is `llOf_alt` applied to `O.localLanglandsExists`, and `llOf_alt` is `fun h _ ... _ => h`. So the theorem returns the field `localLanglandsExists` of `O` without change. On the trunk, `everyCharacter_of_row` fills this field with the theorem `recTExists`, which the Lean code proves. So the proof on the trunk does not assume local Langlands. The Lean statement is weaker than the published theorem. It states existence only, with no uniqueness and no surjectivity. It does not match $L$-factors or $\varepsilon$-factors of pairs, and injectivity holds only on good representations.'

- name: UpperTheory.LiteratureTheorems.nef_rr_of_literature
  statement: GlobalTheory.CompanionTheory.Ar.Pub.NefRR
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 551
  result: Asymptotic Riemann-Roch for nef divisors
  says: 'Let $X$ be a variety of dimension $D$ in a product of projective spaces, and let $a$ be a multidegree that is nef on the generic fibre. Then the spaces of sections of $\mathcal{O}(\tau a)$ are finite-dimensional over $\mathbb{Q}$. Also $D!$ times their dimension divided by $\tau^D$ tends to the degree of $a$ on $X$.'
  reads_hypothesis: false
  cite:
    - authors: [Robert Lazarsfeld]
      title: Positivity in Algebraic Geometry I
      venue: Ergeb. Math. Grenzgeb. 48, Springer
      year: 2004
      doi: 10.1007/978-3-642-18808-4
      verified: true
  note: 'In Lazarsfeld this is Corollary 1.4.41 (the corollary number is from memory and was not checked). In Lean, sections are modelled as the $\mathbb{Q}$-span of a lattice of elements integral over the chart rings, so the model is the normalisation of the generic fibre. The proof is a direct term and does not use `O`.'

- name: UpperTheory.LiteratureTheorems.poincare_lelong_inv_of_literature
  statement: GlobalTheory.CompanionTheory.Hypotheses₂.PoincareLelongInv
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 553
  result: Poincaré-Lelong formula (integrated form used in arithmetic intersection theory)
  says: 'Let $X$ be an arithmetic subvariety of a product of projective spaces, with smooth conjugation-invariant metrized line bundles $L_j$, $A$ and $B$, where $B$ has weight zero. Let $s$ be a section of $A$. Then the integral of $\log \lVert s \rVert$ against the Chern forms of $B$ and the $L_j$ equals two terms. The first is the sum over horizontal components $W$ of $\operatorname{div}(s)$ of their multiplicity times the integral of $\log h_B$ over $W$. The second, which is subtracted, is the integral of $\log h_B$ against the Chern form of $A$.'
  reads_hypothesis: false
  cite:
    - authors: [Phillip Griffiths, Joseph Harris]
      title: Principles of Algebraic Geometry
      venue: Wiley
      year: 1978
      doi: 10.1002/9781118032527
      verified: true
    - authors: [Jean-Benoît Bost, Henri Gillet, Christophe Soulé]
      title: Heights of projective varieties and positive Green forms
      venue: J. Amer. Math. Soc. 7
      year: 1994
      doi: 10.1090/S0894-0347-1994-1260106-X
      verified: true
  math2: B2YBWQQMHA
  note: 'This is a consequence of the Poincaré-Lelong formula $dd^c \log \lvert s \rvert^2 = [\operatorname{div} s] - c_1(A)$, combined with Stokes. It is not the formula itself. In Lean the integral over the complex points uses a projection chosen with `Classical.choice`. A Lebesgue integral of a non-integrable function is $0$, so check that the model integral is the right one. The proof does not use `O`.'

- name: UpperTheory.LiteratureTheorems.point_separation_pair_of_literature
  statement: GlobalTheory.Published.PointSeparationPair
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 471
  result: Angehrn-Siu point separation for adjoint bundles
  says: 'Let $X$ be a normal projective complex variety of dimension $n$ with a klt boundary $\Delta$. Let $M$ be a line bundle numerically equal to $G/m + N_0/r$, where $G$ is a log canonical multiple and $N_0$ is nef and big. Assume that every subvariety of dimension $e$ through $x_1$ or $x_2$ has $N_0$-degree large compared with $c_e^e$, and that the sum of $2^{1/e} e / c_e$ is at most $1$. Then some section of $M$ vanishes at exactly one of the two distinct closed points $x_1$ and $x_2$.'
  reads_hypothesis: false
  cite:
    - authors: [Urban Angehrn, Yum-Tong Siu]
      title: Effective freeness and point separation for adjoint bundles
      venue: Invent. Math. 122
      year: 1995
      doi: 10.1007/BF01231446
      verified: true
  note: 'This is a variant of the Angehrn-Siu theorem, written with a $\mathbb{Q}$-divisor $\Delta$ and numerical constants $c_e$. The exact constants were not compared with the published statement. The proof is a direct term and does not use `O`.'

