- name: UpperTheory.LiteratureTheorems.semi_abelian_lie_seminegative_of_literature
  statement: GlobalTheory.Published.SemiAbelianLieSeminegative
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 499
  result: Seminegativity of the Lie algebra of a semi-abelian scheme over a curve (dually, nefness of the Hodge bundle)
  says: 'Let $C$ be a smooth projective geometrically connected curve over a field of characteristic zero, and let $G$ be a semi-abelian group scheme over $C$. Then every vector bundle $W$ that injects into $\operatorname{Lie}(G)$ has $\det W$ of degree at most $0$.'
  reads_hypothesis: false
  cite:
    - authors: [Laurent Moret-Bailly]
      title: Pinceaux de variétés abéliennes
      venue: Astérisque 129, Soc. Math. France
      year: 1985
      verified: true
    - authors: [Takao Fujita]
      title: On Kähler fiber spaces over curves
      venue: J. Math. Soc. Japan 30
      year: 1978
      doi: 10.2969/jmsj/03040779
      verified: true
    - authors: [Gerd Faltings, Ching-Li Chai]
      title: Degeneration of Abelian Varieties
      venue: Ergeb. Math. Grenzgeb. (3) 22, Springer
      year: 1990
      doi: 10.1007/978-3-662-02632-8
      verified: true
  note: 'Moret-Bailly (on Numdam, no DOI) proves that the determinant of the relative Lie algebra is negative. The Lean form is stronger: it covers every subsheaf that is a vector bundle, which is seminegativity of $\operatorname{Lie}(G)$ as a bundle. In characteristic zero this follows from the semipositivity of the Hodge bundle (Griffiths, Fujita). The proof is a direct term and does not use `O`.'

- name: UpperTheory.LiteratureTheorems.siegel_toroidal_integral_of_literature
  statement: GlobalTheory.Published.SiegelToroidalIntegral
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 509
  result: Faltings-Chai toroidal compactification of the Siegel moduli space over the integers with the n-th roots of unity and 1/n
  says: 'For each $g \geq 1$ there is a polarised fan with the following property. For each odd $n \geq 3$ the moduli space of principally polarised abelian schemes with level $n$ has a compactification $S$, which is projective and smooth over $\mathbb{Z}[\zeta_n, 1/n]$ of relative dimension $g(g+1)/2$. The open part is dense in every fibre. The universal abelian scheme extends to a semi-abelian scheme, and the boundary has toroidal charts. A power of the Hodge bundle is generated by global sections, and large powers of it twisted by minus the boundary are ample.'
  reads_hypothesis: false
  cite:
    - authors: [Gerd Faltings, Ching-Li Chai]
      title: Degeneration of Abelian Varieties
      venue: Ergeb. Math. Grenzgeb. (3) 22, Springer
      year: 1990
      doi: 10.1007/978-3-662-02632-8
      verified: true
  note: 'The Lean form asks only for odd $n \geq 3$. The published theorem covers all $n \geq 3$. The relevant results are in Faltings-Chai Chapters IV and V. The theorem numbers were not checked. The proof is a direct term and does not use `O`.'

- name: UpperTheory.LiteratureTheorems.theta_integrals_agree_and_local_matching_of_literature
  statement: GlobalTheory.IndefiniteRowSideFullHecke.WeilTensorModels.ThetaIntegralsAgree ∧ GlobalTheory.IndefiniteRowSideFullHecke.WeilTensorModels.LocalMatching
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 565
  result: Not identified (theta integrals for unitary dual pairs, with Siegel-Weil inputs)
  says: '`LocalMatching` says that for each admissible triple of geometric data, characters and test data for a unitary dual pair over a CM extension, there are matched local data. `ThetaIntegralsAgree` says three things. The theta integrals decay. Matched data give one constant and coinvariance. The constants for signature $(a, b+2)$ and $(a, b)$, or $(b+2, a'')$ and $(b, a'')$, differ by an explicit factor that involves a partial Hecke $L$-value.'
  reads_hypothesis: false
  cite:
    - authors: [Stephen S. Kudla, Stephen Rallis]
      title: "A regularized Siegel-Weil formula: the first term identity"
      venue: Ann. of Math. 140
      year: 1994
      doi: 10.2307/2118540
      verified: true
    - authors: [Atsushi Ichino]
      title: A regularized Siegel-Weil formula for unitary groups
      venue: Math. Z. 247
      year: 2004
      doi: 10.1007/s00209-003-0580-5
      verified: true
  note: 'This is a project-specific statement, not a published theorem we could identify. The proof is `theoremK_head2` applied to `eis_bl_of_literature O` and `siegel_weil_std_of_literature O`. Both ignore `O`, so `O` is used in name only. The citations are only the probable sources of those two inputs (Eisenstein series and Siegel-Weil). They are not a source for this statement.'

- name: UpperTheory.LiteratureTheorems.toroidal_for_fan_ks_of_literature
  statement: GlobalTheory.Published.ToroidalForFanKS
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 523
  result: Toroidal compactifications of PEL-type unitary Shimura varieties with the log Kodaira-Spencer isomorphism
  says: 'Take a unitary Shimura variety of signature $(p, q)$ over a CM field, a level, and a smooth polarised fan with no self-intersection. Then there is a toroidal model over the coefficient field. Its generic part is smooth, its boundary has simple normal crossings and lies outside the abelian locus, and it has toroidal charts. A twist of the Hodge bundle by the boundary is ample, and the log Kodaira-Spencer map is an isomorphism.'
  reads_hypothesis: false
  cite:
    - authors: [Kai-Wen Lan]
      title: Arithmetic Compactifications of PEL-Type Shimura Varieties
      venue: London Math. Soc. Monogr. 36, Princeton Univ. Press
      year: 2013
      doi: 10.1515/9781400846016
      verified: true
    - authors: [Gerd Faltings, Ching-Li Chai]
      title: Degeneration of Abelian Varieties
      venue: Ergeb. Math. Grenzgeb. (3) 22, Springer
      year: 1990
      doi: 10.1007/978-3-662-02632-8
      verified: true
  note: 'The Lean form is over the coefficient field (characteristic zero), so it is weaker than Lan''s integral result. The proof is a direct term and does not use `O`.'

- name: UpperTheory.LiteratureTheorems.zarhin_statement
  statement: GlobalTheory.CompanionTheory.Ar.GR.ZarhinStatement
  file: Development/AutomorphicArithmetic/ThetaCorrespondence/ThetaPairLifts/ThirdPlaceSeries/EveryCharacterOfLiteratureOfVWin.lean
  line: 547
  result: Zarhin's trick
  says: 'Let $R$ be the valuation ring of an algebraically closed valued field, and let $A$ be an abelian scheme over $R$ with a relatively ample line bundle. Then $A$ is a retract of a principally polarised abelian scheme over $R$, through group homomorphisms $i$ and $r$ with $i$ followed by $r$ equal to the identity.'
  reads_hypothesis: false
  cite:
    - authors: [Yuri G. Zarhin]
      title: A remark on endomorphisms of abelian varieties over function fields of finite characteristic
      venue: Math. USSR-Izv. 8
      year: 1974
      doi: 10.1070/IM1974v008n03ABEH002115
      verified: true
    - authors: [Yuri G. Zarhin]
      title: A finiteness theorem for unpolarized abelian varieties over number fields with prescribed places of bad reduction
      venue: Invent. Math. 79
      year: 1985
      doi: 10.1007/BF01388976
      verified: true
    - authors: [Laurent Moret-Bailly]
      title: Pinceaux de variétés abéliennes
      venue: Astérisque 129, Soc. Math. France
      year: 1985
      verified: true
  note: 'The Lean form is a consequence of Zarhin''s trick, which says $(A \times A^\vee)^4$ has a principal polarisation. It is weaker, because it does not name the principally polarised scheme. The DOI 10.1007/BF01388979 is not this paper. It resolves to Hendriks, ''Hyperplane complements of large type''. The correct DOI for Zarhin, Invent. Math. 79 (1985) is 10.1007/BF01388976. The proof passes `O` to `dual_abelian_scheme_of_literature`, which ignores `O`, so `O` is used in name only.'

- name: UpperTheory.LiteratureTheorems.OpenImageCondition
  statement: "structure with one field galoisRepOfPolarizedPairLit : UpperTheory.V.Z.Win.RowT"
  file: Development/AutomorphicArithmetic/AutomorphicVarieties/ModularityArgument/ThresholdArguments/DenseThresholdCases/TemperedProductOfSquareIntegrable.lean
