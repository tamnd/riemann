- name: PositivityTheory.Pf1.HilbertSamuelMoriwaki.hsUse_outright
  statement: PositivityTheory.Pf1.HilbertSamuelMoriwaki.HSUse
  file: Development/WeilBound/CoreStatements/AutomorphicKernels/MoriwakiBigness/MoriwakiBigTheorem/Outright.lean
  line: 13
  result: Arithmetic Hilbert-Samuel theorem (upper bound) and arithmetic nonnegativity for nef bundles
  says: '`HSUse` is three statements about arithmetic subvarieties of a product of projective spaces over $\mathbb{Z}$. `ArithKleiman` says a nef hermitian line bundle with nonnegative heights on arithmetic curves has nonnegative self-intersection. `G7` and `ArithmeticVolumeNef` say that the number of small sections of tensor powers grows at most like the arithmetic self-intersection times $n^{D+1}/(D+1)!$, as a $\limsup$ bound.'
  reads_hypothesis: false
  cite:
    - authors: [Henri Gillet, Christophe Soulé]
      title: An arithmetic Riemann-Roch theorem
      venue: Invent. Math. 110
      year: 1992
      doi: 10.1007/BF01231343
      verified: true
    - authors: [Ahmed Abbes, Thierry Bouche]
      title: Théorème de Hilbert-Samuel « arithmétique »
      venue: Ann. Inst. Fourier 45
      year: 1995
      doi: 10.5802/aif.1458
      verified: true
    - authors: [Shouwu Zhang]
      title: Positive line bundles on arithmetic varieties
      venue: J. Amer. Math. Soc. 8
      year: 1995
      doi: 10.1090/S0894-0347-1995-1254133-7
      verified: true
  note: 'The Lean form has only the upper bound ($\limsup \leq$), not the asymptotic equality of the published theorem. Intersection numbers come from an abstract `IntersectionSystem` that satisfies the axioms `IsIntersectionSystem`. They are not the Gillet-Soulé numbers, so the result depends on those axioms. This entry takes no `O` argument. It is proved from `resK`, the Poincaré-Lelong result and `DenseCurves`.'

- name: PositivityTheory.Pf1.HilbertSamuelMoriwaki.moriwakiBig_outright
  statement: ReciprocityTheory.ChartRestriction.G.ArakelovGeometry.MoriwakiBigStatement
  file: Development/WeilBound/CoreStatements/AutomorphicKernels/MoriwakiBigness/MoriwakiBigTheorem/Outright.lean
  line: 9
  result: Moriwaki's bigness / volume of nef hermitian line bundles (with Yuan)
  says: 'Let $A$ be a hermitian line bundle on an arithmetic variety of dimension $D+1$ in a product of projective spaces. Assume $A$ is semipositive, conjugation-invariant, nef on fibres and nef on the generic fibre. Then its arithmetic self-intersection number is at most its arithmetic volume.'
  reads_hypothesis: false
  cite:
    - authors: [Atsushi Moriwaki]
      title: Continuity of volumes on arithmetic varieties
      venue: J. Algebraic Geom. 18
      year: 2009
      doi: 10.1090/S1056-3911-08-00500-6
      verified: true
    - authors: [Xinyi Yuan]
      title: Big line bundles over arithmetic varieties
      venue: Invent. Math. 173
      year: 2008
      doi: 10.1007/s00222-008-0127-9
      verified: true
  note: 'The Lean form is the inequality self-intersection $\leq$ volume. For nef bundles the published result gives equality, so the Lean form is weaker. Positive self-intersection then implies bigness. As in `hsUse_outright`, the intersection numbers come from an abstract `IntersectionSystem`. This entry takes no `O` argument.'
